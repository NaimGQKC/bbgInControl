<title>Sparrow en acción</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap">
<style>
/* Layout: a ledger. Left a phone that plays one real-looking conversation; right two columns, "Sparrow" (full, automatic) and "Tú" (empty until the meeting). */
:root {
  --bg: #F6F2EA; --card: #FFFDF8; --ink: #1C2433; --muted: #596073; --line: #E1D8C8;
  --accent: #B4553A; --on-accent: #FFFFFF; --soft: #F1E3DA; --bubble-in: #FFFFFF; --bubble-out: #F3DDD3; --ok: #2F7A4F;
  --f-display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --f-body: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13171E; --card: #1B212B; --ink: #EDE8DF; --muted: #A3AAB8; --line: #2B3340;
  --accent: #E58565; --on-accent: #1A1410; --soft: #3A2A25; --bubble-in: #232B37; --bubble-out: #4A2F27; --ok: #6CC391; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #13171E; --card: #1B212B; --ink: #EDE8DF; --muted: #A3AAB8; --line: #2B3340;
  --accent: #E58565; --on-accent: #1A1410; --soft: #3A2A25; --bubble-in: #232B37; --bubble-out: #4A2F27; --ok: #6CC391; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.wrap { max-width: 1080px; margin: 0 auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-size: 26px; letter-spacing: -.01em; }
.lang { display: flex; gap: 4px; }
.lang button { background: none; border: 1px solid transparent; padding: 6px 10px; min-height: 36px; border-radius: 999px; font: 500 12px var(--f-mono); letter-spacing: .06em; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { border-color: var(--line); color: var(--ink); background: var(--card); }

.hero { padding-block: 28px 8px; max-width: 760px; }
.eyebrow { font: 500 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
h1 { font: 400 clamp(34px, 6.2vw, 60px)/1.04 var(--f-display); letter-spacing: -.02em; margin: 0 0 14px; text-wrap: balance; }
h1 em { font-style: normal; color: var(--accent); }
.lede { color: var(--muted); font-size: 18px; margin: 0; max-width: 60ch; }

.controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 22px 0 18px; }
.play { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }
.dots { display: flex; gap: 6px; }
.dots button { width: 44px; height: 44px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.dots button::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); background: transparent; transition: .25s; }
.dots button[aria-current="step"]::before { background: var(--accent); border-color: var(--accent); width: 14px; height: 14px; }
.dots button.seen::before { border-color: var(--accent); }

.stage { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } .phone-col { justify-self: center; width: 100%; max-width: 340px; } }

/* phone */
.phone { background: var(--card); border: 1px solid var(--line); border-radius: 34px; padding: 10px; box-shadow: 0 18px 40px -22px rgba(20, 25, 35, .45); }
.screen { background: var(--bg); border-radius: 26px; height: 560px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--card); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.chat-head b { display: block; font-size: 14px; line-height: 1.2; }
.chat-head span { font: 400 11px var(--f-mono); color: var(--muted); }
.thread { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 12px; transition: padding .3s;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30px); mask-image: linear-gradient(to bottom, transparent 0, #000 30px); }
.screen.cal-on .thread { padding-bottom: 104px; }
.msg { max-width: 86%; padding: 8px 11px; border-radius: 14px; font-size: 13.5px; line-height: 1.38; overflow-wrap: anywhere; display: none; }
.msg.on { display: block; animation: rise .35s ease both; }
.msg.in { align-self: flex-start; background: var(--bubble-in); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.out { align-self: flex-end; background: var(--bubble-out); border-bottom-right-radius: 4px; }
.msg small { display: block; margin-top: 5px; font-size: 11px; color: var(--muted); }
.typing { align-self: flex-end; display: none; gap: 4px; padding: 11px 13px; border-radius: 14px; background: var(--bubble-out); }
.typing.on { display: flex; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
.toast { position: absolute; left: 12px; right: 12px; top: 64px; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 12px; font-size: 13px; display: none; z-index: 2; }
.toast.on { display: block; animation: drop .4s ease both; }
.toast b { font-weight: 600; } .toast span { display: block; font: 400 11px var(--f-mono); opacity: .8; margin-top: 2px; }
.cal { position: absolute; left: 12px; right: 12px; bottom: 12px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 10px 12px; display: none; z-index: 2; box-shadow: 0 8px 20px -12px rgba(0,0,0,.4); }
.cal.on { display: block; animation: rise .4s ease both; }
.cal .k { font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cal b { display: block; font-size: 14px; margin: 2px 0; } .cal p { margin: 0; font-size: 12.5px; color: var(--muted); }

/* ledger */
.ledger { margin: 0; padding: 0; list-style: none; }
.cols { display: grid; grid-template-columns: 72px minmax(0, 1fr) minmax(0, 1fr); gap: 0 16px; padding: 0 0 10px; font: 500 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cols .you { color: var(--accent); }
.row { display: grid; grid-template-columns: 72px minmax(0, 1fr) minmax(0, 1fr); gap: 0 16px; padding: 14px 0; border-top: 1px solid var(--line); opacity: .5; transition: opacity .4s; }
.row.done, .row.active { opacity: 1; }
.row .t { font: 500 12px var(--f-mono); color: var(--muted); padding-top: 3px; }
.row .s { font-size: 15px; min-width: 0; }
.row .s b { display: block; font-weight: 600; }
.row .s span { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.row .y { min-width: 0; color: var(--muted); font-size: 14px; border-left: 1px dashed var(--line); padding-left: 16px; display: flex; align-items: flex-start; }
.row .y.me { border-left: 3px solid var(--accent); background: var(--soft); border-radius: 0 12px 12px 0; padding: 10px 12px 10px 13px; color: var(--ink); flex-direction: column; }
.row .y.me b { font-weight: 600; font-size: 15px; }
.row .y.me span { color: var(--muted); font-size: 13px; margin-top: 2px; }
.row.active .s b::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; animation: blink 1.4s infinite; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font: 400 11.5px var(--f-mono); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--card); }
.chip.fact { color: var(--ink); }
.notes { margin: 18px 0 0; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.notes b { color: var(--ink); }
.skip { text-decoration: line-through; text-decoration-color: var(--accent); }
.foot { margin-top: 28px; color: var(--muted); font-size: 13px; max-width: 70ch; }

@media (max-width: 600px) {
  .cols { display: none; }
  .row { grid-template-columns: 1fr; gap: 6px; }
  .row .y { border-left: 0; padding-left: 0; }
  .row .y.me { padding-left: 13px; border-left: 3px solid var(--accent); }
  .row .y:not(.me)::before { content: attr(data-you) " "; font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes drop { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
@keyframes blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">

    <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-l="es" aria-pressed="true">ES</button><button type="button" data-l="en" aria-pressed="false">EN</button><button type="button" data-l="fr" aria-pressed="false">FR</button></div>
  </header>

  <section class="hero">

    </div>
  </section>
  <p class="foot" id="foot"></p>
</div>

      ["09:41", "A lead comes in", "Marta Gómez, flat in Delicias.", ["Form or connected CRM", "Private owners in your area (optional)"]],

  },
  fr: {

    who: "Laura · RE/MAX", whoSub: "depuis votre numéro WhatsApp",

      ["09:41 + 30 s", "Premier WhatsApp depuis votre numéro", "Sans avoir à y penser.", []],

    me: ["Estimation avec Marie", "Vend dans 3 mois · appartement rénové · 95 m²"],

    foot: "Exemple illustratif avec des données inventées. Les vrais messages sont rédigés par l'assistant selon ce que vous réglez avec lui.",
    chat: [
      [1, "out", "Bonjour Marie, je vous écris de la part de Laura (RE/MAX Confort), qui vous propose, sans frais ni engagement, une étude de marché avec les prix auxquels des biens similaires au vôtre se sont vendus à Delicias. Envisagez-vous toujours de vendre ?", "Je respecte votre temps : si vous préférez que je ne vous écrive pas, répondez STOP et je ne vous dérangerai plus."],

    ],
    cal: ["Google Calendar · votre agenda", "Estimation · Marie Gómez", "Mardi 18:00 · Calle Delicias 12"]

};

const $ = (id) => document.getElementById(id);
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const STEPS = 6, STEP_MS = 5200, HOLD_MS = 7000;
let lang = "es", step = STEPS - 1, playing = false, timer = null, timeouts = [];

function later(fn, ms) { timeouts.push(setTimeout(fn, ms)); }
function clearLater() { timeouts.forEach(clearTimeout); timeouts = []; if (timer) { clearTimeout(timer); timer = null; } }

function build() {
  const T = TXT[lang];
  document.documentElement.lang = lang;
  $("eyebrow").textContent = T.eyebrow; $("h1").innerHTML = T.h1; $("lede").textContent = T.lede;
  $("who").textContent = T.who; $("whoSub").textContent = T.whoSub;
  $("colS").textContent = T.colS; $("colY").textContent = T.colY;
  $("notes").innerHTML = T.notes; $("foot").textContent = T.foot;
  $("toast").innerHTML = `<b>${T.toast[0]}</b><span>${T.toast[1]}</span>`;
  $("cal").innerHTML = `<span class="k">${T.cal[0]}</span><b>${T.cal[1]}</b><p>${T.cal[2]}</p>`;
  $("ledger").innerHTML = T.rows.map((r, i) => {
    const chips = r[3].map((c, k) => `<span class="chip ${i === 2 ? "fact" : ""}">${c}</span>`).join("");
    const you = i === STEPS - 1 ? `<div class="y me" data-you="${T.you}"><b>${T.me[0]}</b><span>${T.me[1]}</span></div>` : `<div class="y" data-you="${T.you}">—</div>`;
    return `<li class="row" data-i="${i}"><div class="t">${r[0]}</div><div class="s"><b>${r[1]}</b><span>${r[2]}</span>${chips ? `<div class="chips">${chips}</div>` : ""}</div>${you}</li>`;
  }).join("");
  $("thread").innerHTML = T.chat.map((m) => `<div class="msg ${m[1]}" data-s="${m[0]}">${m[2]}${m[3] ? `<small>${m[3]}</small>` : ""}</div>`).join("") + `<div class="typing" id="typing"><i></i><i></i><i></i></div>`;
  $("dots").setAttribute("aria-label", T.step);
  $("dots").innerHTML = T.rows.map((r, i) => `<button type="button" data-i="${i}" aria-label="${T.step} ${i + 1}: ${r[1]}"></button>`).join("");
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === lang));
  $("play").textContent = playing ? T.pause : T.play;
  show(step, true);
}

// Put the page in the state of `n` (0..5). instant = no staging, everything up to n at once.
function show(n, instant) {
  step = n;
  document.querySelectorAll(".row").forEach((r) => { const i = +r.dataset.i; r.classList.toggle("done", i < n); r.classList.toggle("active", i === n); });
  document.querySelectorAll("#dots button").forEach((b) => { const i = +b.dataset.i; b.classList.toggle("seen", i < n); if (i === n) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current"); });
  const msgs = [...document.querySelectorAll(".msg")];
  msgs.forEach((m) => m.classList.toggle("on", +m.dataset.s <= n));
  $("toast").classList.toggle("on", n === 0);
  $("cal").classList.toggle("on", n >= 4);
  document.querySelector(".screen").classList.toggle("cal-on", n >= 4);
  $("typing").classList.remove("on");
  if (instant) return;
  // stage the messages of this step one after another, with a typing bubble before each assistant message
  const mine = msgs.filter((m) => +m.dataset.s === n);
  mine.forEach((m) => m.classList.remove("on"));
  let t = 500;
  mine.forEach((m) => {
    if (m.classList.contains("out") && n > 1) { later(() => $("typing").classList.add("on"), t); t += 900; }
    later(() => { $("typing").classList.remove("on"); m.classList.add("on"); }, t);
    t += 1100;
  });
}

function advance() {
  if (!playing) return;
  const last = step >= STEPS - 1;
  timer = setTimeout(() => { if (last) { show(0); } else { show(step + 1); } advance(); }, last ? HOLD_MS : STEP_MS);
}
function setPlaying(on) {
  playing = on; $("play").textContent = on ? TXT[lang].pause : TXT[lang].play;
  clearLater();
  if (on) { show(0); advance(); }
}

$("play").addEventListener("click", () => setPlaying(!playing));
$("dots").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; playing = false; $("play").textContent = TXT[lang].play; clearLater(); show(+b.dataset.i, true); });
document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.l; const was = playing; playing = false; clearLater(); build(); if (was) setPlaying(true); }));

build();                                   // first frame: the finished story, nothing hidden
if (!reduce) setTimeout(() => setPlaying(true), 1200);   // then it plays from the start
</script>
