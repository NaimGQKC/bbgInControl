{% extends "base.html" %}
{% block title %}Configura tu asistente · Sparrow AI{% endblock %}
{% block head %}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --shadow:0 1px 2px rgba(28,36,51,.06), 0 8px 24px rgba(28,36,51,.07); --glass:rgba(255,253,248,.93); --ease:cubic-bezier(.22,.8,.24,1); --dock:120px; }
  html { -webkit-text-size-adjust:100%; }
  body { font-family:"Hanken Grotesk", -apple-system, "Segoe UI", sans-serif; }
  input, button { font-family:inherit; }
  body { background:radial-gradient(1200px 600px at 50% -10%, rgba(180,85,58,.10), transparent 60%), var(--bg); -webkit-font-smoothing:antialiased; }
  body.split { padding-right:var(--side,500px); } body.split .dock, body.split .top { right:var(--side,500px); }
  .chat { max-width:560px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .top { position:fixed; top:0; left:0; right:0; z-index:5; background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(18px); backdrop-filter:saturate(180%) blur(18px); padding-top:env(safe-area-inset-top); }
  .top-in { max-width:560px; margin:0 auto; padding:10px 16px; display:flex; gap:10px; align-items:center; }
  .avatar, .orb { border-radius:50%; flex:none; background:conic-gradient(from 0deg,#B4553A,#E9A07C,#F6F2EA,#1C2433,#B4553A); animation:spin 9s linear infinite; position:relative; }
  .avatar { width:28px; height:28px; font-size:0; } .avatar::after, .orb::after { content:""; position:absolute; inset:22%; border-radius:50%; background:var(--bg); filter:blur(1px); opacity:.88; }
  .orb { width:56px; height:56px; filter:blur(.3px); box-shadow:0 0 50px rgba(180,85,58,.25); }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes breathe { 50% { transform:scale(1.12); } }
  [data-orb=google] .orb, [data-orb=google] .avatar { background:conic-gradient(#EA4335,#FBBC05,#34A853,#4285F4,#EA4335); animation-duration:2.2s; }
  [data-orb=ok] .orb, [data-orb=ok] .avatar, [data-orb=done] .orb, [data-orb=done] .avatar { background:conic-gradient(#1FAF6B,#7EE2B0,#1FAF6B); animation:breathe 2.4s ease-in-out infinite; }
  [data-orb=meta] .orb, [data-orb=meta] .avatar { background:conic-gradient(#25D366 calc(var(--p,10) * 1%), rgba(150,150,150,.35) 0); animation:none; transition:background .6s; }
  .hero { margin:6px 0 18px; } .hero h1 { font-size:34px; line-height:1.15; margin:18px 0 0; font-weight:600; letter-spacing:-.02em; font-family:"Instrument Serif", Georgia, serif; font-weight:400; font-size:44px; letter-spacing:-.01em; color:var(--ink); }
  .hl { font-weight:600; background:linear-gradient(transparent 52%, rgba(180,85,58,.32) 52%); border-radius:2px; padding:0 1px; }
  .w { opacity:0; animation:wd .55s var(--ease) forwards; } @keyframes wd { from { opacity:0; filter:blur(4px); transform:translateY(4px); } to { opacity:1; filter:none; transform:none; } }
  .who { flex:1; line-height:1.2; min-width:0; } .who b { display:block; font-size:15px; } .who span { font-family:"IBM Plex Mono", monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .tools { max-width:560px; margin:0 auto; padding:0 16px 8px; display:flex; gap:8px; }
  .tools button { background:var(--card); border:1px solid var(--line); border-radius:99px; padding:4px 12px; font:inherit; font-size:12.5px; color:var(--ink); cursor:pointer; }
  .tools button:hover { border-color:var(--accent); }
  .row-edit { display:flex; align-items:center; gap:10px; margin:8px 0; } .row-edit .k { min-width:92px; } .row-edit .v { flex:1; min-width:0; word-break:break-word; } .row-edit button { padding:4px 10px; font-size:13px; }
  .helpbtn { background:none; border:0; color:var(--accent); font:inherit; font-size:13px; cursor:pointer; padding:6px 4px; white-space:nowrap; }
  .bar { height:2px; background:transparent; } .bar i { display:block; height:2px; width:0; background:var(--accent); transition:width .8s var(--ease); }
  .msgs { flex:1; gap:14px; padding:calc(112px + env(safe-area-inset-top)) 16px calc(var(--dock) + 24px); display:flex; flex-direction:column; gap:10px; }
  .msgs > .new, .msgs > .opts { animation:rise .45s var(--ease) both; } .msgs.quiet > * { animation:none !important; }
  @keyframes rise { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:none; } }
  .b { max-width:100%; white-space:pre-line; line-height:1.5; }
  .bot { font-size:19px; color:var(--ink); line-height:1.5; letter-spacing:-.005em; align-self:flex-start; margin:4px 0; }
  .me { background:var(--line); color:var(--ink); align-self:flex-end; max-width:82%; padding:9px 16px; border-radius:22px; font-size:16px; }
  .dock { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; justify-content:center; padding:0 12px calc(12px + env(safe-area-inset-bottom)); pointer-events:none; }
  .actions { pointer-events:auto; width:100%; max-width:536px; background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(22px); backdrop-filter:saturate(180%) blur(22px); border:1px solid var(--line); border-radius:30px; padding:10px; box-shadow:0 10px 40px rgba(28,36,51,.14); }
  .comp { display:flex; align-items:flex-end; gap:4px; }
  .comp textarea { flex:1; min-width:0; resize:none; border:0; background:transparent; outline:none; font:inherit; font-size:17px; line-height:1.4; padding:11px 8px; max-height:150px; color:var(--ink); border-radius:0; }
  .send { flex:none; width:42px; height:42px; border-radius:50%; border:0; background:var(--ink); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-bottom:1px; }
  .send:active { transform:scale(.94); }
  .opts { display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 6px; }
  .opts .btn { border-radius:99px; padding:11px 18px; font-size:15px; transition:transform .15s var(--ease); background:var(--ink); color:#fff; }
  .opts .btn.secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .opts .btn.g { background:#fff; color:#3c4043; border:1px solid #dadce0; }
  .opts.solo .btn { flex:1 1 100%; padding:19px 24px; font-size:17px; }
  .opts .btn:active { transform:scale(.97); }
  .b.think { color:var(--muted); animation:blink 1.1s infinite; }
  .btn.g { background:#fff; color:#3c4043; border:1px solid #dadce0; font-weight:500; }
  .wait { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:14px; padding:2px 4px 8px; }
  .spin { width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:sp 0.8s linear infinite; flex:none; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .coach { background:var(--card); box-shadow:var(--shadow); border-radius:22px; padding:13px 18px; font-size:15px; align-self:stretch; }
  .coach ol { margin:6px 0 0; padding-left:20px; } .coach li { margin:4px 0; }
  .warn { border-left:3px solid var(--accent); }
  .err { color:var(--bad); font-size:14px; margin-top:6px; } .err:empty { display:none; }
  .progress { font-size:12px; color:var(--muted); font-weight:400; }
  .typing { display:inline-flex; gap:4px; padding:8px 0; }
  .typing i { width:7px; height:7px; border-radius:50%; background:var(--muted); opacity:.35; animation:blink 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay:.18s; } .typing i:nth-child(3) { animation-delay:.36s; }
  @keyframes blink { 0%,80%,100% { opacity:.25; transform:translateY(0) } 40% { opacity:1; transform:translateY(-3px) } }
  .wa2 { align-self:stretch; border-radius:18px; overflow:hidden; box-shadow:var(--shadow); color:#111; }
  .wa-head { background:#075E54; color:#fff; display:flex; align-items:center; gap:10px; padding:9px 12px; } .wa-head b { display:block; font-size:15px; font-weight:600; line-height:1.2; } .wa-head small { opacity:.8; font-size:12px; }
  .wa-av { width:34px; height:34px; border-radius:50%; background:#25D366; display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; }
  .wa-body { background:#ECE5DD; padding:12px 10px 14px; display:flex; flex-direction:column; gap:6px; min-height:120px; background-image:radial-gradient(rgba(0,0,0,.04) 1px, transparent 1px); background-size:14px 14px; }
  .wab { max-width:86%; padding:7px 9px 5px; border-radius:9px; font-size:15px; line-height:1.4; white-space:pre-line; box-shadow:0 1px 1px rgba(0,0,0,.12); }
  .wab.in { background:#fff; align-self:flex-start; border-top-left-radius:2px; } .wab.out { background:#D9FDD3; align-self:flex-end; border-top-right-radius:2px; animation:rise .4s var(--ease) both; }
  .wab .t { display:block; text-align:right; font-size:11px; color:#667781; margin-top:2px; } .tick { color:#53BDEB; }
  .wa { align-self:stretch; background:#ECE5DD; border-radius:18px; padding:12px; box-shadow:var(--shadow); color:#111; }
  .wa small { display:block; color:#667781; font-size:12px; margin-bottom:6px; }
  .wa div { background:#DCF8C6; border-radius:12px; padding:9px 11px; white-space:pre-line; font-size:15px; box-shadow:0 1px 1px rgba(0,0,0,.08); }
  .suggest { display:flex; flex-wrap:wrap; gap:6px; margin:2px 4px 8px; }
  .actions .suggest .btn { padding:6px 12px; font-size:13px; font-weight:500; flex:0 0 auto; }
  .mic { flex:none; width:44px; height:44px; border-radius:50%; border:0; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s, color .2s; }
  .mic:hover { color:var(--ink); } .mic.on { background:var(--accent); color:#fff; animation:breathe 1.2s ease-in-out infinite; }
  .att { flex:none; width:40px; height:44px; border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:20px; }
  .skip { background:none; border:0; color:var(--muted); font:inherit; font-size:14px; padding:6px 10px; cursor:pointer; }
  .suggest button { padding:6px 12px; font-size:13px; border-radius:99px; flex:none !important; }
  .chip { display:flex; align-items:center; gap:8px; margin:6px 0; } .chip code { flex:1; }
  .chip button { padding:5px 10px; font-size:13px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
{% endblock %}
{% block body %}
<div class="chat">
  <div class="top">
    <div class="top-in">
      <div class="avatar" id="avatar"></div>
      <div class="who"><b><span id="aname"></span> <span class="progress" id="progress"></span></b><span>Asistente IA de Sparrow</span></div>
      <button class="helpbtn" id="helpbtn" type="button">Hablar con una persona</button>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="tools"><button type="button" id="mydata">Mis datos</button><button type="button" id="askbtn">Preguntar algo</button></div>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="dock"><div class="actions" id="actions">
    <div id="status"></div>
    <form class="comp" id="comp"><button class="att" id="att" type="button" aria-label="Subir captura">📎</button><textarea id="ci" rows="1" placeholder="Escribe o toca una opción…" autocomplete="off"></textarea><button class="send" id="send" type="submit" aria-label="Enviar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button><input id="cf" type="file" accept="image/*" hidden></form>
    <div class="err" id="err"></div>
  </div></div>
</div>

<script>
const TOKEN = {{ token|tojson }};
const FAKE = {{ 'true' if fake else 'false' }};
const META = { appId: {{ meta_app_id|tojson }}, configId: {{ meta_config_id|tojson }}, version: {{ graph_version|tojson }} };
let state = {{ state_json|safe }};
const params = new URLSearchParams(location.search);
// Google opens in a side window; when it lands back here, that window reports the result and closes itself
try {
  const g = params.get("google"), flag = +(localStorage.getItem(`sp:${TOKEN}:popup`) || 0);
  if (g && flag && Date.now() - flag < 600000) {
    localStorage.setItem(`sp:${TOKEN}:popup`, "0"); localStorage.setItem(`sp:${TOKEN}:gres`, g + ":" + Date.now());
    window.close();
    document.body.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin-top:30vh">Listo. Ya puedes cerrar esta ventana y volver a Sparrow.</p>';
    throw new Error("popup-done");
  }
} catch (e) { if (e.message === "popup-done") throw e; }
const STALE = Symbol("stale");
const isMobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const setOrb = (v, p) => { document.documentElement.dataset.orb = v; if (p !== undefined) document.documentElement.style.setProperty("--p", p); };
const $msgs = document.getElementById("msgs"), $actions = document.getElementById("actions");

// ---- tiny storage helpers (storage can be blocked: the chat must still work)
const store = {
  get(k) { try { return localStorage.getItem(`sp:${TOKEN}:${k}`); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(`sp:${TOKEN}:${k}`, v); } catch (e) {} },
};
const seen = new Set(JSON.parse(store.get("seen") || "[]"));

// ---- chat mechanics: ONE continuous conversation. Messages already shown replay instantly; new ones fade in word by word.
let gen = 0, pollTimer = null;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const $status = document.getElementById("status"), $ci = document.getElementById("ci"), $comp = document.getElementById("comp"), $cf = document.getElementById("cf"), $att = document.getElementById("att");
function add(text, who, fresh = true) {
  const d = document.createElement("div"); d.className = "b " + who + (fresh ? " new" : "");
  if (who === "bot") {  // **text** is highlighted; new messages fade in word by word
    const parts = text.split(/(\*\*[^*]+\*\*)/).filter(Boolean), total = text.split(/\s+/).length, step = Math.min(38, 900 / Math.max(total, 1)); let k = 0;
    for (const seg of parts) {
      const hl = seg.startsWith("**"), body = hl ? seg.slice(2, -2) : seg;
      if (!fresh) { if (hl) { const g = document.createElement("span"); g.className = "hl"; g.textContent = body; d.append(g); } else d.append(body); continue; }
      for (const t of body.split(/(\s+)/)) {
        if (!t) continue;
        if (/^\s+$/.test(t)) { if (hl) { const g = document.createElement("span"); g.className = "hl"; g.textContent = t; d.append(g); } else d.append(t); continue; }
        const w = document.createElement("span"); w.className = "w" + (hl ? " hl" : ""); w.style.animationDelay = (k++ * step) + "ms"; w.textContent = t; d.append(w);
      }
    }
  } else d.textContent = text;
  $msgs.appendChild(d); return d;
}
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function scroll() { requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: calm || $msgs.classList.contains("quiet") ? "auto" : "smooth" })); }
// the floating dock changes height: keep the last message always visible above it
new ResizeObserver(() => { document.documentElement.style.setProperty("--dock", ($actions.offsetHeight || 0) + 12 + "px"); scroll(); }).observe($actions);
async function say(text, who, my) {
  const key = who === "bot" ? text : "me:" + text, fresh = !seen.has(key);
  if (fresh) { seen.add(key); store.set("seen", JSON.stringify([...seen])); $msgs.classList.remove("quiet"); }
  if (my !== gen) throw STALE;
  add(text, who, fresh); scroll();
  if (fresh && who === "bot") await sleep(Math.min(1000, 250 + text.split(/\s+/).length * 28));  // let the words land before the next line
}
async function api(path, body) {
  const r = await fetch(`/api/o/${TOKEN}${path}`, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({ ok: false, error: "Error de conexión" }));
  if (data.step) state = data;
  return data;
}
function err(t) { document.getElementById("err").textContent = t || ""; }

// ---- the composer (always there): answers the question in view, or chats with Lucía about anything
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const CAN_TALK = !!SR && !/iPhone|iPad|iPod/i.test(navigator.userAgent) && !/Firefox/i.test(navigator.userAgent);  // patchy there: hide the button
const DEFAULT_PH = "Escribe o toca una opción…";
let expect = null, chatOnce = false, shot = null, busy = false;
const helpHistory = [];
function resize() { $ci.style.height = "auto"; $ci.style.height = Math.min($ci.scrollHeight, 150) + "px"; }
function setExpect(o) { expect = o; chatOnce = false; $ci.value = o.value || $ci.value;  // keep what they already typed while the question was still appearing
   $ci.placeholder = o.ph || DEFAULT_PH; $ci.setAttribute("inputmode", o.type === "tel" ? "tel" : "text"); resize(); $ci.focus(); }
function clearExpect() { expect = null; chatOnce = false; $ci.value = ""; $ci.placeholder = DEFAULT_PH; $ci.setAttribute("inputmode", "text"); resize(); }
$ci.addEventListener("input", resize);
$ci.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !isMobile) { e.preventDefault(); $comp.requestSubmit(); } });
function talk(input, btn) {  // the browser's own speech recognition: free; the words show (and wrap) as they are heard, so they can be fixed before sending
  let rec = null, base = "", ph = "";
  btn.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = "es-ES"; rec.interimResults = true; rec.continuous = true;
    base = input.value ? input.value.trim() + " " : ""; ph = input.placeholder;
    btn.classList.add("on"); input.placeholder = "Te escucho…";
    rec.onresult = (e) => { let t = ""; for (const r of e.results) t += r[0].transcript; input.value = base + t; resize(); };
    const stop = () => { btn.classList.remove("on"); input.placeholder = ph; rec = null; input.focus(); };
    rec.onend = stop; rec.onerror = (e) => { stop(); if (e.error === "not-allowed") err("Activa el micrófono en el navegador para poder hablar."); };
    rec.start();
  };
}
if (CAN_TALK) {
  const m = document.createElement("button"); m.className = "mic"; m.id = "mic"; m.type = "button"; m.setAttribute("aria-label", "Hablar");
  m.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
  $comp.insertBefore(m, document.getElementById("send")); talk($ci, m);
}
async function shrink(file) {  // screenshots are resized in the browser: small, fast, and never stored
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.8);
}
$att.onclick = () => $cf.click();
$cf.onchange = async () => { try { shot = await shrink($cf.files[0]); $att.textContent = "✅"; err(""); } catch (e) { shot = null; err("No he podido leer esa imagen."); } };
$comp.onsubmit = async (e) => {
  e.preventDefault();
  const text = $ci.value.trim();
  if (!text && !shot) return;
  if (busy) { err("Un segundo, que termino de escribir…"); return; }  // never send an answer to the wrong place while a question is still appearing
  err("");
  if (expect && !chatOnce && !shot) return expect.onSubmit(text, false);  // answering the question in view
  return askLucia(text);  // anything else is a conversation with Lucía
};
async function askLucia(text) {
  const image = shot; shot = null; $cf.value = ""; $att.textContent = "📎";
  chatOnce = false; $ci.value = ""; resize(); if (expect) $ci.placeholder = expect.ph || DEFAULT_PH;
  add((image ? "📷 " : "") + (text || "Captura de pantalla"), "me"); scroll();
  helpHistory.push({ role: "user", text });
  const thinking = add("…", "bot", false); thinking.classList.add("think"); scroll();
  const r = await api("/help_chat", { text, image, history: helpHistory.slice(-6) });
  thinking.remove();
  if (r.ok) {
    helpHistory.push({ role: "bot", text: r.reply }); add(r.reply, "bot"); scroll();
    if (r.proposal) offerChange(r.proposal);
  } else {
    add(r.capped ? "Hemos hablado bastante por aquí. Mejor te ayuda una persona del equipo." : (r.error || "Ahora mismo no puedo ayudarte yo. Mejor te ayuda una persona del equipo."), "bot");
    buttons([{ label: "Hablar con una persona", onClick: () => document.getElementById("helpbtn").click() }], true);
  }
}
const FIELDS = [
  ["agent_name", "Nombre", "¿Cómo te llamas?"], ["agency", "Inmobiliaria", "¿En qué inmobiliaria trabajas?"],
  ["zones", "Zonas", "¿En qué zonas captas? Sepáralas con comas."], ["extra_context", "Cómo trabajo", "Cuéntame cómo quieres que trabaje."],
  ["personal_whatsapp", "Móvil de avisos", "¿A qué móvil te aviso si un cliente te necesita?"],
];
function offerChange(p) {  // Lucía proposes, the agent confirms: the AI never changes their data on its own
  const label = (FIELDS.find((f) => f[0] === p.field) || [0, p.field])[1];
  buttons([
    { label: `Sí, cambiar ${label.toLowerCase()}`, onClick: async (el) => {
        el.disabled = true; const r = await api("/answers", { [p.field]: p.value });
        if (r.ok === false) { add(r.error || "No he podido cambiarlo.", "bot"); return; }
        if (p.field === "agent_name") store.set("nameOk", "1");
        await render(); add("Hecho, cambiado.", "bot"); scroll(); } },
    { label: "No", secondary: true, onClick: (el) => el.closest(".opts").remove() },
  ], true);
}
function helpChat(topic) {  // "Preguntar algo" / "Me ha salido otra cosa": the next message goes to Lucía
  add(topic === "general" ? "Pregúntame lo que quieras: precio, cómo funciona, tus datos… Si algo no sale bien en pantalla, sube una captura con el clip. No escribas aquí contraseñas ni códigos." : "Cuéntame qué te sale en pantalla, con tus palabras o subiendo una captura con el clip, y lo vemos juntos. No escribas aquí contraseñas ni códigos.", "bot");

function buttons(list, side = false) {
  if (!side) document.querySelectorAll(".opts.main").forEach((e) => e.remove());
  const row = document.createElement("div"); row.className = "opts " + (side ? "side" : "main") + (list.length === 1 && !side ? " solo" : "");
  list.forEach((b) => { const el = document.createElement("button"); el.type = "button"; el.className = "btn " + (b.secondary ? "secondary " : "") + (b.cls || ""); el.innerHTML = b.label; el.onclick = () => b.onClick(el); row.appendChild(el); });
  $msgs.appendChild(row); scroll();
}
function inputRow({ ph = "", type = "text", onSubmit, optional = false, skipLabel = "Saltar", suggestions = [], joiner = ". ", zones = false, value = "" }) {
  document.querySelectorAll(".opts.main").forEach((e) => e.remove());
  setExpect({ ph, type, value, onSubmit });
  const row = document.createElement("div"); row.className = "opts main";
  const pill = (t, on, secondary = true) => { const b = document.createElement("button"); b.type = "button"; b.className = "btn " + (secondary ? "secondary" : ""); b.textContent = t; b.onclick = () => on(b); row.appendChild(b); return b; };
  for (const text of suggestions) pill(text, () => { $ci.value = $ci.value ? `${$ci.value}${joiner}${text}` : text; resize(); $ci.focus(); });  // tap an example to add it; the agent can edit freely
  if (zones) zonePicker(row, pill);
  if (optional) pill(skipLabel, () => onSubmit("", true));
  if (row.children.length) $msgs.appendChild(row);
  err(""); scroll();
}
// zones: tap the city first (Spain shares one timezone, so we can't guess it), then tap neighbourhoods instead of typing commas
const CITIES = {
  Madrid: ["Chamberí", "Salamanca", "Retiro", "Chamartín", "Centro", "Arganzuela", "Tetuán", "Moncloa"],
  Barcelona: ["Eixample", "Gràcia", "Sarrià", "Les Corts", "Sant Martí", "Poblenou", "Sants", "Horta"],
  Valencia: ["Ruzafa", "El Carmen", "Benimaclet", "Campanar", "Pla del Real", "Algirós", "Patraix"],
  Sevilla: ["Nervión", "Triana", "Los Remedios", "Macarena", "Casco Antiguo", "Heliópolis"],
  Zaragoza: ["Delicias", "Actur", "Centro", "Universidad", "San José", "Las Fuentes", "Casco Histórico"],
  Málaga: ["Centro", "Teatinos", "Limonar", "El Palo", "Pedregalejo", "Huelin"],
};
function zonePicker(row, pill) {
  const cities = () => { row.innerHTML = ""; for (const c of Object.keys(CITIES)) pill(c, () => hoods(c)); };
  const hoods = (c) => {
    row.innerHTML = ""; pill("← " + c, cities);
    for (const h of CITIES[c]) pill(h, (b) => { const cur = $ci.value.split(",").map((x) => x.trim()).filter(Boolean); if (!cur.includes(h)) cur.push(h); $ci.value = cur.join(", "); resize(); b.style.opacity = ".45"; $ci.focus(); });
  };
  cities();
}

// ---- proactive coaching: say the right thing at the right moment while the user is in someone else's window
const sayOnce = new Set();
async function coach(my, key, text) {
  if (sayOnce.has(key) || my !== gen) return;
  sayOnce.add(key);
  try { await say(text, "bot", my); } catch (e) { if (e !== STALE) throw e; }
}

  if (again) document.getElementById("again").onclick = again;
}
const GOOGLE_BTN = { cls: "g", label: `<svg width="18" height="18" viewBox="0 0 48 48" style="vertical-align:-3px;margin-right:10px"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg> Continuar con Google` };
function sideSpot(w) {  // where a side window goes: the right edge of the screen the browser is on, never off-screen
  const right = Math.min((window.screenX || 0) + window.outerWidth, (screen.availLeft || 0) + screen.availWidth) - 12;
  return { left: Math.max(0, right - w), top: Math.max(0, (window.screenY || 0) + 40) };
}
function splitView(w) { document.documentElement.style.setProperty("--side", (w + 24) + "px"); document.body.classList.add("split"); }
function connectGoogle(my) {
  const url = `/oauth/google/start?t=${TOKEN}`;
  let w = null;
  if (!isMobile) {
    try { store.set("popup", String(Date.now())); const wide = window.innerWidth >= 1000, pw = 480, { left, top } = sideSpot(pw);
    w = window.open(url, "sparrow-google", `width=${pw},height=700,left=${left},top=${top}`);
    if (w && wide) splitView(pw); } catch (e) {}  // split: chat moves left, Google's window sits on the right, not on top of Lucía
  }
  if (!w) { store.set("popup", "0"); location.href = url; return; }  // phone or blocked: same tab, nothing else to coordinate
  setOrb("google"); waiting("Esperando a Google… mírala en la ventana de al lado", () => connectGoogle(my));
  const timers = [
    setTimeout(() => coach(my, "g1", "Elige tu cuenta de Google Calendar."), 3500),
    setTimeout(() => coach(my, "g3", "Deja **todas las casillas marcadas** y pulsa Continuar."), 9000),
  ];
  const done = setInterval(async () => {
    const res = (store.get("gres") || "").split(":")[0];
    if (res === "denied") { clearInterval(done); timers.forEach(clearTimeout); store.set("gres", ""); params.set("google", "denied"); try { w.close(); } catch (e) {} return render(); }
    await api("");
    if (state.integrations.google && state.integrations.google.status === "active") { clearInterval(done); timers.forEach(clearTimeout); store.set("gres", ""); try { w.close(); } catch (e) {} render(); }
    else if (w.closed && !(res)) { clearInterval(done); timers.forEach(clearTimeout); $status.innerHTML = ""; await coach(my, "gx", "Se cerró antes de terminar. Otra vez:"); buttons([{ ...GOOGLE_BTN, onClick: () => connectGoogle(my) }]); }
  }, 1500);
}

// ---- the conversation: every step lives in the same thread; finished steps replay instantly as history
const QUESTIONS = [
  { f: "agent_name", q: "¿Cómo te llamas? (nombre y apellido)", ph: "Laura García" },
  { f: "agency", q: "¿En qué inmobiliaria trabajas?", ph: "RE/MAX Confort" },
  { f: "zones", q: "¿En qué zonas o barrios captas? Sepáralos con comas.", ph: "Delicias, Actur, Centro" },
];
async function render() {
  document.body.classList.remove("split");
  const my = ++gen;
  clearInterval(pollTimer);
  $msgs.innerHTML = ""; $msgs.classList.add("quiet"); $status.innerHTML = ""; clearExpect(); err("");
  busy = true;
  try { await flow(my); } catch (e) { if (e !== STALE) throw e; }
  if (my === gen) busy = false;
  $msgs.classList.remove("quiet"); scroll();
}
async function flow(my) {
  const bot = (t) => say(t, "bot", my), me = (t) => say(t, "me", my);
  const a = state.answers, integ = state.integrations, step = state.step, pay = state.payment;
  const at = (s) => ["google", "questions", "payment", "wa_check", "whatsapp", "waiting_templates", "done"].indexOf(s);
  const early = at(step) <= at("wa_check");
  updateProgress();
  setOrb(state.status === "live" ? "done" : "idle");

  $msgs.insertAdjacentHTML("beforeend", `<div class="hero"><div class="orb"></div><h1>Hola, soy ${state.assistant}</h1></div>`);
  await bot("La IA de Sparrow. Contacto a tus propietarios por WhatsApp y te agendo las valoraciones. Lo dejamos listo en 10 minutos.");

  // 1. Google: one click, and we learn who they are. Google's screens can't show our words, so we warn first and coach in time.
  await bot("Primero, tu Google Calendar: ahí verás las citas.");
  if (!integ.google || integ.google.status !== "active") {
    if (params.get("google") === "denied") await bot("Parece que no se completó el permiso. Sin calendario no puedo agendar: vuelve a intentarlo cuando quieras.");
    buttons([{ ...GOOGLE_BTN, onClick: () => connectGoogle(my) }]);
    return;
  }
  setOrb("ok"); setTimeout(() => { if (document.documentElement.dataset.orb === "ok") setOrb("idle"); }, 3500);
  await me("✅ Calendario conectado");
  let peek = JSON.parse(store.get("peek") || "null");  // proof that it works, and an early warning if a permission is missing
  if (!peek) { const r = await api("/calendar_check", {}); if (r.ok) { peek = r; store.set("peek", JSON.stringify(r)); } else peek = { failed: true }; }
  if (peek.failed) {
    await bot("No consigo leer tu calendario: falta algún permiso. Conéctalo otra vez con todas las casillas marcadas.");
    buttons([{ label: "Conectar de nuevo", onClick: () => connectGoogle(my) }]);
    return;
  }
  await bot(peek.first.length ? `Veo tu agenda perfectamente: estás libre el ${peek.first.join(" o el ")}.` : "Veo tu agenda perfectamente.");

  // 2. Name (from Google: only confirm it), then what the website demo already told us (confirm once), then whatever is still missing
  const nameOk = () => store.get("nameOk") === "1";
  const v0 = a.agent_name;
  if (v0 && !nameOk() && step === "questions") {
    await bot(`Veo que te llamas ${v0}. ¿Te llamo ${firstName(v0)}?`);
    buttons([{ label: `Sí, ${firstName(v0)}`, onClick: () => { store.set("nameOk", "1"); render(); } },
             { label: "Prefiero otro nombre", secondary: true, onClick: () => { bot(QUESTIONS[0].q); inputRow({ ph: "Laura García", onSubmit: async (val) => { if (!val) return; const r = await api("/answers", { agent_name: val }); if (r.ok === false) return err(r.error); store.set("nameOk", "1"); render(); } }); } }]);
    return;
  }
  const pre = QUESTIONS.filter((q) => q.f !== "agent_name" && a[q.f] && store.get("ask:" + q.f) !== "1");  // given before (website demo): confirm in one line, don't re-ask
  if (pre.length) {
    const txt = [a.agency && `trabajas en **${a.agency}**`, a.zones && `captas en **${a.zones}**`].filter(Boolean).join(" y ");
    await bot(`Ya me has contado que ${txt}.`);
    if (store.get("preOk") === "1" || !early) await me("Sí, todo bien");
    else {
      buttons([{ label: "Sí, todo bien", onClick: () => { store.set("preOk", "1"); render(); } }, { label: "Cambiar algo", secondary: true, onClick: () => myData() }]);
      return;
    }
  }
  for (const q of QUESTIONS) {
    if (q.f === "agent_name" || pre.includes(q)) continue;
    const v = a[q.f];
    if (v) { await bot(q.q); await me(v); continue; }
    if (step !== "questions") continue;
    await bot(q.q);
    inputRow({ ph: q.ph, zones: q.f === "zones", joiner: ", ", suggestions: q.f === "agency" && state.agency_hint ? [state.agency_hint] : [], onSubmit: async (val) => {
      if (!val) return;
      const r = await api("/answers", { [q.f]: val });
      if (r.ok === false) return err(r.error);
      store.set("ask:" + q.f, "1");
      render();
    } });
    return;
  }
  if (step === "questions") { await api("/answers", {}); return render(); }

  // 3. How do they want it to work? (optional, free text; it goes straight into the assistant's instructions)
  const PREFS_Q = "Opcional: ¿cómo quieres que trabaje? Horarios, tono, lo que NO debo hacer…";
  if (a.extra_context) { await bot(PREFS_Q); await me(a.extra_context); }
  else if (store.get("prefs") === "skipped") { await bot(PREFS_Q); await me("Así está bien, de momento"); }
  else if (early) {
    await bot(PREFS_Q);
    inputRow({ ph: "Escríbelo con tus palabras", optional: true, skipLabel: "Así está bien",
      suggestions: ["Visitas solo por la tarde", "Trato de usted a los propietarios", "No agendes los viernes", "También valoro locales y terrenos"],
      onSubmit: async (val, skip) => {
        if (skip || !val) { store.set("prefs", "skipped"); return render(); }
        const r = await api("/answers", { extra_context: val });
        if (r.ok === false) return err(r.error);
        render();
      } });
    return;
  }

  // 3a. Their mobile: the number I write from and where I alert them
  const PHONE_Q = "¿Cuál es tu móvil de WhatsApp? Es el número desde el que escribiré a tus propietarios y al que te aviso si un cliente te necesita.";
  const savePhone = async (val) => { if (!val) return; const r = await api("/answers", { personal_whatsapp: val }); if (r.ok === false) return err(r.error); store.set("ask:phone", "1"); store.set("alertOk", "1"); render(); };
  if (store.get("ask:phone") === "1") { await bot(PHONE_Q); await me(pretty(a.personal_whatsapp)); }
  else if (early && a.personal_whatsapp) {  // came with the website demo
    await bot(`Te escribiré y avisaré desde el **${pretty(a.personal_whatsapp)}**. ¿Es tu móvil de WhatsApp?`);
    buttons([{ label: "Sí, es ese", onClick: () => { store.set("ask:phone", "1"); store.set("alertOk", "1"); render(); } },
             { label: "Es otro número", secondary: true, onClick: () => inputRow({ ph: "600 000 000", type: "tel", onSubmit: savePhone }) }]);
    return;
  } else if (early) { await bot(PHONE_Q); inputRow({ ph: "600 000 000", type: "tel", onSubmit: savePhone }); return; }

  // 3b. Show exactly what an owner receives, as it looks on their phone, and what success looks like
  if (state.first_message && early) {
    const hhmm = (d) => d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
    const slot = ((JSON.parse(store.get("peek") || "null") || {}).first || [])[0];
    const showDemo = store.get("previewOk") !== "1";
    await bot(showDemo ? "Esto es una **demostración** de cómo lo verá Marta, una propietaria de ejemplo. Aún no he escrito a nadie:" : "Así ve un propietario mi primer mensaje:");
    const wa = document.createElement("div"); wa.className = "wa2 new";
    const nm = (firstName(a.agent_name) || "Tu nombre") + (a.agency ? " · " + a.agency : "");
    wa.innerHTML = `<div class="wa-head"><div class="wa-av"></div><div><b></b><small>Cuenta de empresa</small></div></div><div class="wa-body"><div class="wab in"><span class="tx"></span><span class="t"></span></div></div>`;
    wa.querySelector(".wa-av").textContent = (a.agent_name || "T").charAt(0); wa.querySelector("b").textContent = nm;
    wa.querySelector(".tx").textContent = state.first_message; wa.querySelector(".t").textContent = hhmm(new Date());
    $msgs.appendChild(wa); scroll();
    if (!showDemo) { await me("Me gusta, seguimos"); }
    else {
      let label = slot, real = false;
      if (slot) {
        if (!seen.has("demo")) {
          await sleep(1400);
          const te = await api("/test_event", {});  // a real test event in their calendar: their phone buzzes
          if (te.ok) { label = te.label; real = true; }
        }
        const body = wa.querySelector(".wa-body"), tm = () => hhmm(new Date());
        const bubble = async (kind, text, wait = 900) => {  // a short, believable exchange: answer, offer, pick, confirm
          const d = document.createElement("div"); d.className = "wab " + kind;
          d.innerHTML = '<span class="tx"></span><span class="t"></span>'; d.querySelector(".tx").textContent = text;
          d.querySelector(".t").innerHTML = tm() + (kind === "out" ? ' <span class="tick">✓✓</span>' : ""); body.appendChild(d); scroll();
          if (!seen.has("demo")) await sleep(wait);
        };
        const other = ((JSON.parse(store.get("peek") || "null") || {}).first || []).find((x) => x !== label);
        await bubble("out", "En buen estado, lo reformamos hace unos años.", 1100);
        await bubble("in", other ? `Genial, gracias. ¿Te va mejor el ${label} o el ${other}?` : `Genial, gracias. ¿Te va bien el ${label}?`, 1100);
        await bubble("out", `El ${label}, perfecto.`, 1000);
        await bubble("in", `Hecho: ${firstName(a.agent_name) || "tu agente"} pasará el ${label}. Te envío un recordatorio.`, 700);
        const ok = document.createElement("div"); ok.className = "coach warn new"; ok.textContent = "✅ Valoración agendada en tu Google Calendar: " + label; $msgs.appendChild(ok); scroll();
        seen.add("demo"); store.set("seen", JSON.stringify([...seen]));
        await bot(real ? "Lo que sí es real: acabo de crear una cita de prueba en tu **Google Calendar**. Abre el calendario." : "Así de simple. Esto lo hago yo por ti, con tus huecos reales.");
      }
      await bot("El primer mensaje es siempre este texto, aprobado por WhatsApp. El tono del resto de la conversación lo adapto a lo que me pidas.");
      const go = async () => { if (real) await api("/test_event/delete", {}); store.set("previewOk", "1"); render(); };
      buttons(real ? [{ label: "Lo he visto · borrar la prueba y seguir", onClick: go }, { label: "No me ha llegado, seguir", secondary: true, onClick: go }, { label: "Cambiar cómo trabajas", secondary: true, onClick: () => editField("extra_context", "Cómo trabajo", "Cuéntame cómo quieres que trabaje.") }]
                   : [{ label: "Me gusta, seguimos", onClick: go }, { label: "Cambiar cómo trabajas", secondary: true, onClick: () => editField("extra_context", "Cómo trabajo", "Cuéntame cómo quieres que trabaje.") }]);
      return;
    }
  }

  // 4. Payment (only when a Stripe link is configured)
  if (pay.required) {
    await bot(`Ya casi. La puesta en marcha cuesta ${pay.fee} € una sola vez. Después, solo pagas ${pay.per_meeting} € por cada cita que te agende: si no hay citas, no pagas nada más.`);
    if (pay.paid) await me("✅ Pago recibido");
    else {
      buttons([
        { label: `Pagar ${pay.fee} €`, onClick: () => { window.open(pay.url, "_blank"); pollTimer = setInterval(async () => { await api(""); if (state.payment.paid) render(); }, 3000);
            err("Cuando termines de pagar, sigo yo sola."); } },
        { label: "Ya he pagado", secondary: true, onClick: async () => { await api(""); render(); } },
      ]);
      return;
    }
  }

  // 5. WhatsApp Business check
  await bot("Escribiré desde tu propio número de WhatsApp.\n• Solo a leads, nunca al resto de tus chats.\n• Si escribes tú, me aparto.\n• Quien pida BAJA no recibe nada más.");
  await bot("¿Qué WhatsApp usas: el normal o WhatsApp Business (icono con una B)? Tiene que ser Business, con la app actualizada.");
  if (at(step) > at("wa_check")) await me(store.get("waAnswer") || "Uso WhatsApp Business");
  else {
    const proceed = async (label) => { await me(label); store.set("waAnswer", label); await api("/step", { done: "wa_check" }); render(); };
    const downloadGuide = async () => {
      await bot("Sin problema, son 2 minutos:\n1. Descarga «WhatsApp Business» (es gratis).\n2. Ábrelo con tu mismo número: tus chats se pasan solos.\n3. Vuelve aquí.");
      buttons([{ label: "Ya lo tengo instalado", onClick: () => proceed("Ya tengo WhatsApp Business") }]);
    };
    buttons([
      { label: "Uso WhatsApp Business", onClick: () => proceed("Uso WhatsApp Business") },
      { label: "Uso el WhatsApp normal", secondary: true, onClick: async () => { await me("Uso el WhatsApp normal"); await downloadGuide(); } },
      { label: "No lo sé", secondary: true, onClick: async () => {
          await me("No lo sé");
          await bot("Fácil: mira el icono de WhatsApp en tu móvil. Si tiene una B blanca, es Business. Si no la tiene, es el normal.");
          buttons([
            { label: "Sí, tiene la B", onClick: () => proceed("Sí, tiene la B") },
            { label: "No, no tiene la B", secondary: true, onClick: async () => { await me("No, no tiene la B"); await downloadGuide(); } },
          ]);
      } },
    ]);
    return;
  }

  // 6. Meta signup
  await bot("Último paso: conectar tu WhatsApp. Se abre una ventana de Meta. Ten a mano el móvil y una tarjeta.");
  if (at(step) > at("whatsapp")) await me("✅ WhatsApp conectado");
  else {
    if (isMobile) {
      await bot("Ojo: este paso es mucho más fácil desde un ordenador, porque tienes que escanear un código con el móvil.");
      const mail = `mailto:${encodeURIComponent(a.email || "")}?subject=${encodeURIComponent("Continuar la configuración de Sparrow")}&body=${encodeURIComponent(location.href)}`;
      $msgs.insertAdjacentHTML("beforeend", `<div class="coach small new"><a href="${mail}">Envíame el enlace por email</a> para seguir desde el ordenador.</div>`);
    }
    $msgs.insertAdjacentHTML("beforeend", `<div class="coach new"><ol>
      <li>Facebook → <b>Continuar</b></li>
      <li>Revisa tus datos → <b>Siguiente</b></li>
      <li>Elige <b>conectar tu app de WhatsApp Business</b> y pon tu número</li>
      <li>Confirma en tu móvil, en <b>WhatsApp Business</b></li>
      <li>Tarjeta → <b>Finalizar</b></li></ol></div>`);
    chips([["Nombre", a.agent_name + (a.agency ? " · " + a.agency : "")], ["Email", a.email], ["Móvil", (a.personal_whatsapp || "").replace(/^\+34/, "")]]);
    if (!FAKE) loadFB();  // load the SDK now so the popup opens straight from the click (no popup blocker)
    buttons([{ label: "Conectar WhatsApp", onClick: (el) => launchSignup(el) }, { label: "Me ha salido otra cosa", secondary: true, onClick: () => helpChat("meta") }]);
    return;
  }

  // 7. Where to alert them (only if we have not asked for their mobile earlier)
  if (store.get("alertOk") !== "1") {
    const saveAlert = async (val) => { const r = await api("/answers", { personal_whatsapp: val }); if (r.ok === false) return err(r.error); store.set("alertOk", "1"); render(); };
    if (a.personal_whatsapp) {
      await bot(`Un último detalle: si un cliente necesita que intervengas tú, te aviso por WhatsApp al ${pretty(a.personal_whatsapp)}. ¿Te va bien ese número?`);
      buttons([{ label: "Sí, perfecto", onClick: () => { store.set("alertOk", "1"); render(); } },
               { label: "Usar otro número", secondary: true, onClick: () => inputRow({ ph: "600 000 000", type: "tel", onSubmit: saveAlert }) }]);
    } else {
      await bot("Un último detalle: ¿a qué móvil te aviso si un cliente necesita que intervengas tú? Solo te escribiré para eso.");
      inputRow({ ph: "600 000 000", type: "tel", onSubmit: saveAlert });
    }
    return;
  }

  // 8. Waiting for Meta / done
  if (state.status !== "live") {
    await bot("Solo falta que WhatsApp apruebe mis mensajes (unas horas, a veces un día). Te escribo yo en cuanto esté.");
    summaryCard();
    pollTimer = setInterval(async () => { await api(""); if (state.status === "live") render(); }, 20000);
    return;
  }
  await bot("Listo 🎉 Cada lead nuevo recibirá un WhatsApp en 30 segundos y las citas caerán en tu Google Calendar. No hace falta volver aquí.");
  summaryCard();
  await bot("De conectar tu fuente de leads (Lystos) nos encargamos nosotros; te escribiremos si necesitamos algo.");
}
// ---- "Mis datos": change anything they told us, at any moment (scripted, no AI). Or just ask Lucía in the chat.
function myData() {
  document.querySelectorAll(".opts").forEach((e) => e.remove());
  add("Esto es lo que tengo. Toca **Cambiar** en lo que quieras, o dímelo aquí abajo.", "bot");
  const card = document.createElement("div"); card.className = "coach new";
  for (const [f, label, q] of FIELDS) {
    const row = document.createElement("div"); row.className = "row-edit";
    row.innerHTML = `<span class="small muted k"></span><span class="v"></span><button class="btn secondary" type="button">Cambiar</button>`;
    row.querySelector(".k").textContent = label;
    row.querySelector(".v").textContent = (f === "personal_whatsapp" ? pretty(state.answers[f]) : state.answers[f]) || "—";
    row.querySelector("button").onclick = () => editField(f, label, q);
    card.appendChild(row);
  }
  $msgs.appendChild(card); scroll();
  buttons([{ label: "Seguir donde estaba", onClick: () => render() }]);
}
function editField(f, label, q) {
  add(q, "bot");
  inputRow({ ph: label, type: f === "personal_whatsapp" ? "tel" : "text", value: state.answers[f] || "", zones: f === "zones", joiner: ", ", optional: true, skipLabel: "Cancelar",
    onSubmit: async (val, skip) => {
      if (skip) return render();
      if (!val && f !== "extra_context") return;
      const r = await api("/answers", { [f]: val });
      if (r.ok === false) return err(r.error);
      if (f === "agent_name") store.set("nameOk", "1");
      if (f === "personal_whatsapp") { store.set("ask:phone", "1"); store.set("alertOk", "1"); }
      if (f === "agency" || f === "zones") store.set("ask:" + f, "1");
      render();
    } });
}
document.getElementById("mydata").onclick = () => myData();
document.getElementById("askbtn").onclick = () => helpChat("general");
// ---- Meta Embedded Signup (WhatsApp Business app onboarding = Coexistence) ----
let signup = {}, metaTimers = [];
function metaCoach(data) {  // Meta tells us which screen the user is on: speak up at that moment
  const step = String((data.data && data.data.current_step) || data.event || "").toLowerCase(), n = firstName(state.answers.agent_name), my = gen;
  const hi = n ? `${n}, ` : "";
  const ring = /qr|scan|link|device/.test(step) ? 75 : /phone|number/.test(step) ? 50 : /pay|billing|card/.test(step) ? 90 : /business|portfolio|info/.test(step) ? 25 : null;
  if (ring) setOrb("meta", ring);
  if (/qr|scan|link|device/.test(step)) coach(my, "m-qr", `${hi}ahora coge tu móvil: abre **WhatsApp Business** y confirma lo que Meta te pida (un código o un mensaje con el botón «Conectar»).`);
  else if (/phone|number/.test(step)) coach(my, "m-phone", `${hi}Meta te pide tu número: pon el de WhatsApp Business, con el que escribes a tus clientes.`);
  else if (/pay|billing|card/.test(step)) coach(my, "m-pay", `${hi}Meta pide una tarjeta: es para que WhatsApp te cobre sus céntimos por conversación. Nosotros no la vemos.`);
  else if (/business|portfolio|info/.test(step)) coach(my, "m-biz", `${hi}revisa que tus datos estén bien y pulsa Siguiente. No hace falta CIF.`);
}
function startMetaCoaching() {  // short tips that cover most cases; Meta's own step signals take over when they arrive; the help chat is the safety net
  const my = gen, n = firstName(state.answers.agent_name), hi = n ? `${n}, ` : "";
  metaTimers.forEach(clearTimeout);
  metaTimers = [
    setTimeout(() => coach(my, "m1", `${hi}Meta te va a pedir iniciar sesión en Facebook. Si no tienes cuenta, puedes crearla ahí mismo.`), 4000),
    setTimeout(() => coach(my, "m2", "Cuando llegues a elegir cómo conectar, escoge **tu app de WhatsApp Business**."), 20000),
    setTimeout(() => coach(my, "m3", "¿Algo no sale como esperabas? Pulsa «Me ha salido otra cosa» y te ayudo."), 60000),
  ];
}
window.addEventListener("message", (event) => {
  if (!event.origin.endsWith("facebook.com")) return;
  try {
    const data = JSON.parse(event.data);
    if (data.type !== "WA_EMBEDDED_SIGNUP") return;
    if (data.event && data.event.startsWith("FINISH")) signup = { waba_id: data.data.waba_id, phone_number_id: data.data.phone_number_id };
    else { api("/meta_event", { event: data.event, current_step: data.data && data.data.current_step }); metaCoach(data); }
  } catch (e) {}
});
function loadFB() {
  if (fbPromise) return fbPromise;
  return fbPromise = new Promise((resolve) => {
    if (window.FB) return resolve();
    window.fbAsyncInit = () => { FB.init({ appId: META.appId, autoLogAppEvents: true, xfbml: false, version: META.version }); fbReady = true; resolve(); };
    const s = document.createElement("script"); s.src = "https://connect.facebook.net/es_ES/sdk.js"; s.async = true; s.crossOrigin = "anonymous";
    document.body.appendChild(s);
  });
}
async function finishSignup(code) {
  add("Conectando…", "me"); scroll();
  const r = await api("/meta", { code, waba_id: signup.waba_id, phone_number_id: signup.phone_number_id });
  if (r.ok === false) { add((r.error || "Algo falló.") + " Puedes reintentarlo; si se repite, pulsa «Hablar con una persona» arriba y te escribimos.", "bot"); buttons([{ label:"Reintentar", onClick: (el) => launchSignup(el) }, { label: "Me ha salido otra cosa", secondary: true, onClick: () => helpChat("meta") }]); return scroll(); }
  render();
}
let fbPromise = null, fbReady = false;
function launchSignup(el) {
  const bizName = state.answers.agent_name + (state.answers.agency ? " · " + state.answers.agency : "");
  try { navigator.clipboard.writeText(bizName).then(() => coach(gen, "copied", `Ya tienes tu nombre copiado («${bizName}»). Si Meta te lo pide, pégalo con Ctrl+V (⌘V en Mac).`)).catch(() => {}); } catch (e) {}  // inside the click: browsers allow it
  if (FAKE) { el.disabled = true; signup = { waba_id:"fake-waba", phone_number_id:"fake-phone-" + TOKEN.slice(0,6) }; return finishSignup("fake-code"); }
  if (!fbReady) { err("Cargando Meta… pulsa de nuevo en un segundo."); loadFB(); return; }
  el.disabled = true; setOrb("meta", 10); startMetaCoaching();
  const a = state.answers;
  const realOpen = window.open;  // the SDK opens Meta's window itself; steer it to the right edge, like Google's
  if (window.innerWidth >= 1000) {
    window.open = function (u, n, f) {
      try {
        const o = {}; String(f || "").split(",").forEach((kv) => { const [k, v] = kv.split("="); if (k) o[k.trim()] = (v || "").trim(); });
        const w = Math.min(+o.width || 520, 560), spot = sideSpot(w);
        o.left = spot.left; o.top = spot.top; splitView(w);
        f = Object.entries(o).map(([k, v]) => k + "=" + v).join(",");
      } catch (e) {}
      return realOpen.call(window, u, n, f);
    };
  }
  FB.login((response) => {
    el.disabled = false; metaTimers.forEach(clearTimeout); setOrb("idle"); document.body.classList.remove("split");
    if (response.authResponse && response.authResponse.code) {
      const code = response.authResponse.code;  // expires in ~30s: send it right away
      // Coexistence only returns waba_id (the server looks up the phone number)
      const wait = (n) => signup.waba_id ? finishSignup(code) : (n > 0 ? setTimeout(() => wait(n-1), 300) : finishSignup(code));
      wait(20);
    } else {
      add("La ventana se cerró antes de terminar. Puedes volver a intentarlo cuando quieras.", "bot"); scroll();
    }
  }, {
    config_id: META.configId,
    response_type: "code",
    override_default_response_type: true,
    extras: {
      setup: { business: { name: a.agent_name + (a.agency ? " · " + a.agency : ""), email: a.email || undefined } },  // no phone pre-fill: Meta must offer to connect the existing WhatsApp Business app
      featureType: "whatsapp_business_app_onboarding",
      sessionInfoVersion: "3",
    },
  });
  window.open = realOpen;
}

render();
</script>
