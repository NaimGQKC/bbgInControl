{% extends "base.html" %}
{% block title %}Configura tu asistente · Sparrow AI{% endblock %}
{% block head %}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --shadow:0 1px 2px rgba(28,36,51,.06), 0 8px 24px rgba(28,36,51,.07); --glass:rgba(255,253,248,.78); --ease:cubic-bezier(.22,.8,.24,1); --dock:120px; }
  html { -webkit-text-size-adjust:100%; }
  body { font-family:"Hanken Grotesk", -apple-system, "Segoe UI", sans-serif; }
  input, button { font-family:inherit; }
  body { background:radial-gradient(1200px 600px at 50% -10%, rgba(180,85,58,.10), transparent 60%), var(--bg); -webkit-font-smoothing:antialiased; }
  body.split { padding-right:500px; } body.split .dock, body.split .top { right:500px; }
  .chat { max-width:560px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .top { position:fixed; top:0; left:0; right:0; z-index:5; background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(18px); backdrop-filter:saturate(180%) blur(18px); padding-top:env(safe-area-inset-top); }
  .top-in { max-width:560px; margin:0 auto; padding:10px 16px; display:flex; gap:10px; align-items:center; }
  .avatar, .orb { border-radius:50%; flex:none; background:conic-gradient(from 0deg,#B4553A,#E9A07C,#F6F2EA,#1C2433,#B4553A); animation:spin 9s linear infinite; position:relative; }
  .avatar { width:28px; height:28px; font-size:0; } .avatar::after, .orb::after { content:""; position:absolute; inset:22%; border-radius:50%; background:var(--bg); filter:blur(1px); opacity:.88; }
  .orb { width:56px; height:56px; filter:blur(.3px); box-shadow:0 0 50px rgba(180,85,58,.25); }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes breathe { 50% { transform:scale(1.12); } }
  [data-orb=google] .orb, [data-orb=google] .avatar { background:conic-gradient(#EA4335,#FBBC05,#34A853,#4285F4,#EA4335); animation-duration:2.2s; }
  [data-orb=ok] .orb, [data-orb=ok] .avatar, [data-orb=done] .orb, [data-orb=done] .avatar { background:conic-gradient(#1FAF6B,#7EE2B0,#1FAF6B); animation:breathe 2.4s ease-in-out infinite; }
  [data-orb=meta] .orb, [data-orb=meta] .avatar { background:conic-gradient(#25D366 calc(var(--p,10) * 1%), rgba(150,150,150,.35) 0); animation:none; transition:background .6s; }
  .hero { margin:6px 0 18px; } .hero h1 { font-size:34px; line-height:1.15; margin:18px 0 0; font-weight:600; letter-spacing:-.02em; font-family:"Instrument Serif", Georgia, serif; font-weight:400; font-size:44px; letter-spacing:-.01em; color:var(--ink); }
  .hl { font-weight:600; background:linear-gradient(transparent 52%, rgba(180,85,58,.32) 52%); border-radius:2px; padding:0 1px; }
  .w { opacity:0; animation:wd .55s var(--ease) forwards; } @keyframes wd { from { opacity:0; filter:blur(4px); transform:translateY(4px); } to { opacity:1; filter:none; transform:none; } }
  .who { flex:1; line-height:1.2; min-width:0; } .who b { display:block; font-size:15px; } .who span { font-family:"IBM Plex Mono", monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .helpbtn { background:none; border:0; color:var(--accent); font:inherit; font-size:13px; cursor:pointer; padding:6px 4px; white-space:nowrap; }
  .bar { height:2px; background:transparent; } .bar i { display:block; height:2px; width:0; background:var(--accent); transition:width .8s var(--ease); }
  .msgs { flex:1; gap:14px; padding:calc(80px + env(safe-area-inset-top)) 16px calc(var(--dock) + 24px); display:flex; flex-direction:column; gap:10px; }
  .msgs > * { animation:rise .45s var(--ease) both; }
  @keyframes rise { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:none; } }
  .b { max-width:100%; white-space:pre-line; line-height:1.5; }
  .bot { font-size:19px; color:var(--ink); line-height:1.5; letter-spacing:-.005em; align-self:flex-start; margin:4px 0; }
  .me { background:var(--line); color:var(--ink); align-self:flex-end; max-width:82%; padding:9px 16px; border-radius:22px; font-size:16px; }
  .dock { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; justify-content:center; padding:0 12px calc(12px + env(safe-area-inset-bottom)); pointer-events:none; }
  .actions { pointer-events:auto; width:100%; max-width:536px; background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(22px); backdrop-filter:saturate(180%) blur(22px); border:1px solid var(--line); border-radius:30px; padding:10px; box-shadow:0 10px 40px rgba(28,36,51,.14); }
  .actions:empty { display:none; }
  .actions > * { animation:rise .4s var(--ease) both; }
  .actions .row { flex-wrap:nowrap; } .actions .row:has(.btn:nth-child(3)) { flex-wrap:wrap; }
  .actions .row input { flex:1; min-width:0; border-radius:99px; border:0; background:transparent; font-size:17px; padding:12px 16px; outline:none; }
  .actions .btn:not(.secondary):not(.g) { background:var(--ink); color:#fff; }
  .actions .btn { border-radius:99px; padding:13px 20px; flex:1 1 auto; text-align:center; transition:transform .15s var(--ease), opacity .2s; }
  .actions .btn:active { transform:scale(.97); } .actions .row input + .btn, .actions .row .mic + .btn { flex:none; }
  .actions .btn.secondary { background:transparent; }
  .btn.g { background:#fff; color:#3c4043; border:1px solid #dadce0; font-weight:500; }
  .wait { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:14px; padding:2px 4px 8px; }
  .spin { width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:sp 0.8s linear infinite; flex:none; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .coach { background:var(--card); box-shadow:var(--shadow); border-radius:22px; padding:13px 18px; font-size:15px; align-self:stretch; }
  .coach ol { margin:6px 0 0; padding-left:20px; } .coach li { margin:4px 0; }
  .warn { border-left:3px solid var(--accent); }
  .err { color:var(--bad); font-size:14px; margin-top:6px; } .err:empty { display:none; }
  .progress { font-size:12px; color:var(--muted); font-weight:400; }
  .typing { display:inline-flex; gap:4px; padding:8px 0; }
  .typing i { width:7px; height:7px; border-radius:50%; background:var(--muted); opacity:.35; animation:blink 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay:.18s; } .typing i:nth-child(3) { animation-delay:.36s; }
  @keyframes blink { 0%,80%,100% { opacity:.25; transform:translateY(0) } 40% { opacity:1; transform:translateY(-3px) } }
  .wa { align-self:stretch; background:#ECE5DD; border-radius:18px; padding:12px; box-shadow:var(--shadow); color:#111; }
  .wa small { display:block; color:#667781; font-size:12px; margin-bottom:6px; }
  .wa div { background:#DCF8C6; border-radius:12px; padding:9px 11px; white-space:pre-line; font-size:15px; box-shadow:0 1px 1px rgba(0,0,0,.08); }
  .suggest { display:flex; flex-wrap:wrap; gap:6px; margin:2px 4px 8px; }
  .actions .suggest .btn { padding:6px 12px; font-size:13px; font-weight:500; flex:0 0 auto; }
  .mic { flex:none; width:44px; height:44px; border-radius:50%; border:0; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s, color .2s; }
  .mic:hover { color:var(--ink); } .mic.on { background:var(--accent); color:#fff; animation:breathe 1.2s ease-in-out infinite; }
  .att { flex:none; width:40px; height:44px; border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:20px; }
  .skip { background:none; border:0; color:var(--muted); font:inherit; font-size:14px; padding:6px 10px; cursor:pointer; }
  .suggest button { padding:6px 12px; font-size:13px; border-radius:99px; flex:none !important; }
  .chip { display:flex; align-items:center; gap:8px; margin:6px 0; } .chip code { flex:1; }
  .chip button { padding:5px 10px; font-size:13px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
{% endblock %}
{% block body %}
<div class="chat">
  <div class="top">
    <div class="top-in">
      <div class="avatar" id="avatar"></div>
      <div class="who"><b><span id="aname"></span> <span class="progress" id="progress"></span></b><span>Asistente IA de Sparrow</span></div>
      <button class="helpbtn" id="helpbtn" type="button">Hablar con una persona</button>
    </div>
    <div class="bar"><i id="barfill"></i></div>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="dock"><div class="actions" id="actions"></div></div>
</div>

<script>
const TOKEN = {{ token|tojson }};
const FAKE = {{ 'true' if fake else 'false' }};
const META = { appId: {{ meta_app_id|tojson }}, configId: {{ meta_config_id|tojson }}, version: {{ graph_version|tojson }} };
let state = {{ state_json|safe }};
const params = new URLSearchParams(location.search);
// Google opens in a side window; when it lands back here, that window reports the result and closes itself
try {
  const g = params.get("google"), flag = +(localStorage.getItem(`sp:${TOKEN}:popup`) || 0);
  if (g && flag && Date.now() - flag < 600000) {
    localStorage.setItem(`sp:${TOKEN}:popup`, "0"); localStorage.setItem(`sp:${TOKEN}:gres`, g + ":" + Date.now());
    window.close();
    document.body.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin-top:30vh">Listo. Ya puedes cerrar esta ventana y volver a Sparrow.</p>';
    throw new Error("popup-done");
  }
} catch (e) { if (e.message === "popup-done") throw e; }
const STALE = Symbol("stale");
const isMobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const setOrb = (v, p) => { document.documentElement.dataset.orb = v; if (p !== undefined) document.documentElement.style.setProperty("--p", p); };
const $msgs = document.getElementById("msgs"), $actions = document.getElementById("actions");

// ---- tiny storage helpers (storage can be blocked: the chat must still work)
const store = {
  get(k) { try { return localStorage.getItem(`sp:${TOKEN}:${k}`); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(`sp:${TOKEN}:${k}`, v); } catch (e) {} },
};
const seen = new Set(JSON.parse(store.get("seen") || "[]"));

// ---- chat mechanics: messages that were already shown appear at once; new ones "type" first, like a person
let gen = 0, pollTimer = null;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function add(text, who) {
  const d = document.createElement("div"); d.className = "b " + who;
  if (who === "bot") {  // words fade in one after another; **text** is highlighted
    const parts = text.split(/(\*\*[^*]+\*\*)/).filter(Boolean), total = text.split(/\s+/).length, step = Math.min(38, 900 / Math.max(total, 1)); let k = 0;
    for (const seg of parts) {
      const mark = seg.startsWith("**"), body = mark ? seg.slice(2, -2) : seg;
      for (const t of body.split(/(\s+)/)) { if (!t) continue; if (/^\s+$/.test(t)) { if (mark) { const g = document.createElement("span"); g.className = "hl"; g.textContent = t; d.append(g); } else d.append(t); continue; } const w = document.createElement("span"); w.className = "w" + (mark ? " hl" : ""); w.style.animationDelay = (k++ * step) + "ms"; w.textContent = t; d.append(w); }
    }
  } else d.textContent = text;
  $msgs.appendChild(d); return d;
}
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function scroll() { requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: calm ? "auto" : "smooth" })); }
// the floating dock changes height: keep the last message always visible above it
new ResizeObserver(() => { document.documentElement.style.setProperty("--dock", ($actions.offsetHeight || 0) + 12 + "px"); scroll(); }).observe($actions);
async function say(text, who, my) {
  const fresh = who === "bot" && !seen.has(text);
  if (fresh) { seen.add(text); store.set("seen", JSON.stringify([...seen])); }
  if (my !== gen) throw STALE;
  add(text, who); scroll();
  if (fresh) await sleep(Math.min(1000, 250 + text.split(/\s+/).length * 28));  // let the words land before the next line
}
function stage() { $msgs.innerHTML = ""; }  // a finished step dissolves; only the current one stays on screen
async function api(path, body) {
  const r = await fetch(`/api/o/${TOKEN}${path}`, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({ ok: false, error: "Error de conexión" }));
  if (data.step) state = data;
  return data;
}
function err(t) { const e = document.getElementById("err"); if (e) e.textContent = t || ""; }
function inputRow({ ph = "", type = "text", button = "Enviar", onSubmit, optional = false, skipLabel = "Saltar", suggestions = [], joiner = ". ", zones = false }) {
  $actions.innerHTML = `${suggestions.length ? '<div class="suggest" id="sg"></div>' : ""}<form class="row" id="f"><input id="i" type="${type}" placeholder="${ph}" autocomplete="on" ${optional ? "" : "required"}>${CAN_TALK && type === "text" ? '<button class="mic" id="mic" type="button" aria-label="Hablar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>' : ""}
    <button class="btn" type="submit">${button}</button></form>${optional ? `<div style="text-align:center"><button class="skip" type="button" id="skip">${skipLabel}</button></div>` : ""}<div class="err" id="err"></div>`;
  const i = document.getElementById("i"); i.focus();
  for (const text of suggestions) {  // tap an example to add it; the agent can edit the text freely
    const b = document.createElement("button"); b.type = "button"; b.className = "btn secondary"; b.textContent = text;
    b.onclick = () => { i.value = i.value ? `${i.value}${joiner}${text}` : text; i.focus(); };
    document.getElementById("sg").appendChild(b);
  }
  if (zones) zonePicker(i);
  if (CAN_TALK && type === "text") talk(i, document.getElementById("mic"));
  scroll();
  document.getElementById("f").onsubmit = async (e) => { e.preventDefault(); await onSubmit(i.value.trim(), false); };
  if (optional) document.getElementById("skip").onclick = () => onSubmit("", true);
}
// ---- talk instead of type (the browser's own speech recognition: free, shows the words so they can be fixed before sending)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const CAN_TALK = !!SR && !/iPhone|iPad|iPod/i.test(navigator.userAgent) && !/Firefox/i.test(navigator.userAgent);  // patchy there: hide the button
function talk(input, btn) {
  let rec = null, base = "";
  btn.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = "es-ES"; rec.interimResults = true; rec.continuous = false;
    base = input.value ? input.value.trim() + " " : "";
    btn.classList.add("on"); input.placeholder = "Te escucho…";
    rec.onresult = (e) => { let t = ""; for (const r of e.results) t += r[0].transcript; input.value = base + t; };
    const stop = () => { btn.classList.remove("on"); input.placeholder = ""; rec = null; input.focus(); };
    rec.onend = stop; rec.onerror = (e) => { stop(); if (e.error === "not-allowed") err("Activa el micrófono en el navegador para poder hablar."); };
    rec.start();
  };
}
// zones: tap the city first (Spain shares one timezone, so we can't guess it), then tap neighbourhoods instead of typing commas
const CITIES = {
  Madrid: ["Chamberí", "Salamanca", "Retiro", "Chamartín", "Centro", "Arganzuela", "Tetuán", "Moncloa"],
  Barcelona: ["Eixample", "Gràcia", "Sarrià", "Les Corts", "Sant Martí", "Poblenou", "Sants", "Horta"],
  Valencia: ["Ruzafa", "El Carmen", "Benimaclet", "Campanar", "Pla del Real", "Algirós", "Patraix"],
  Sevilla: ["Nervión", "Triana", "Los Remedios", "Macarena", "Casco Antiguo", "Heliópolis"],
  Zaragoza: ["Delicias", "Actur", "Centro", "Universidad", "San José", "Las Fuentes", "Casco Histórico"],
  Málaga: ["Centro", "Teatinos", "Limonar", "El Palo", "Pedregalejo", "Huelin"],
};
function zonePicker(input) {
  const box = document.createElement("div"); box.className = "suggest"; $actions.prepend(box);
  const pill = (t, on) => { const b = document.createElement("button"); b.type = "button"; b.className = "btn secondary"; b.textContent = t; b.onclick = on; box.appendChild(b); return b; };
  const cities = () => { box.innerHTML = ""; for (const c of Object.keys(CITIES)) pill(c, () => hoods(c)); };
  const hoods = (c) => {
    box.innerHTML = ""; pill("← " + c, cities);
    for (const h of CITIES[c]) { const b = pill(h, () => { const cur = input.value.split(",").map((x) => x.trim()).filter(Boolean); if (!cur.includes(h)) cur.push(h); input.value = cur.join(", "); b.style.opacity = ".45"; input.focus(); }); }
  };
  cities();
}
function buttons(list) {
  $actions.innerHTML = `<div class="row">${list.map((b, k) => `<button class="btn ${b.secondary ? "secondary" : ""} ${b.cls || ""}" data-k="${k}">${b.label}</button>`).join("")}</div><div class="err" id="err"></div>`;
  $actions.querySelectorAll("button").forEach((el) => (el.onclick = () => list[+el.dataset.k].onClick(el)));
  scroll();  // the bar just grew: keep the last message visible above it
}
function summaryCard() {
  const a = state.answers, d = document.createElement("div"); d.className = "coach";
  const rows = [["Agencia", a.agency], ["Zonas", a.zones], ["Calendario", "✅ Google Calendar conectado"], ["WhatsApp", "✅ Tu número, conectado"], ["Avisos a", pretty(a.personal_whatsapp)]].filter((x) => x[1]);
  d.innerHTML = rows.map(([k, v]) => `<div class="chip"><span class="small muted" style="min-width:80px">${k}</span><span class="sv"></span></div>`).join("");
  d.querySelectorAll(".sv").forEach((el, k) => (el.textContent = rows[k][1]));
  $msgs.appendChild(d);
}
function chips(items) {  // copy-paste helpers next to Meta's window
  const d = document.createElement("div"); d.className = "coach";
  d.innerHTML = "<b>Si Meta te pide algo, cópialo de aquí:</b>";
  for (const [label, value] of items.filter((x) => x[1])) {
    const row = document.createElement("div"); row.className = "chip";
    row.innerHTML = `<span class="small muted" style="min-width:64px">${label}</span><code></code><button class="btn secondary" type="button">Copiar</button>`;
    row.querySelector("code").textContent = value;
    row.querySelector("button").onclick = async (e) => { try { await navigator.clipboard.writeText(value); e.target.textContent = "¡Copiado!"; } catch (x) { e.target.textContent = "Cópialo a mano"; } };
    d.appendChild(row);
  }
  $msgs.appendChild(d);
}
const firstName = (n) => (n || "").trim().split(/\s+/)[0];
const pretty = (p) => (p || "").replace(/^\+34(\d{3})(\d{3})(\d{3})$/, "+34 $1 $2 $3");

// ---- header: who is talking, progress, help
document.getElementById("aname").textContent = state.assistant;
document.getElementById("avatar").textContent = state.assistant.charAt(0);
function updateProgress() {
  const n = { google: 1, questions: 2, payment: 3, wa_check: 3, whatsapp: 4, waiting_templates: 4, done: 4 }[state.step] || 1;
  document.getElementById("progress").textContent = state.step === "done" ? "listo" : `${n}/4`;
  document.getElementById("barfill").style.width = (state.step === "done" ? 100 : n * 25 - 12) + "%";
}
document.getElementById("helpbtn").onclick = () => {
  add("¿Prefieres que te llame una persona del equipo o que te escriba?", "bot"); scroll();
  buttons([
    { label: "📞 Que me llamen", onClick: () => helpForm("call") },
    { label: "💬 Que me escriban", onClick: () => helpForm("chat") },
    { label: "Seguir aquí", secondary: true, onClick: () => render() },
  ]);
};
function helpForm(kind) {
  const call = kind === "call";
  $actions.innerHTML = `<form id="hf" style="display:grid; gap:8px">
    <input id="hm" placeholder="${call ? "¿Cuándo te viene bien? (opcional)" : "¿Qué te pasa? (opcional)"}">
    ${state.answers.personal_whatsapp ? "" : '<input id="hp" type="tel" placeholder="Tu móvil" required>'}
    <div class="row"><button class="btn" type="submit">${call ? "Pedir llamada" : "Pedir que me escriban"}</button><button class="btn secondary" type="button" id="hx">Atrás</button></div><div class="err" id="err"></div></form>`;
  document.getElementById("hx").onclick = () => render();
  scroll();
  document.getElementById("hf").onsubmit = async (e) => {
    e.preventDefault();
    const r = await api("/help", { kind, message: document.getElementById("hm").value, phone: (document.getElementById("hp") || {}).value });
    if (r.ok === false) return err(r.error);
    await render();
    add(call ? `Hecho: una persona del equipo te llamará al ${pretty(r.contact)} lo antes posible.` : `Hecho: te escribimos al ${pretty(r.contact)} en unos minutos. Mientras, puedes seguir por aquí si quieres.`, "bot"); scroll();
  };
}


// ---- proactive coaching: say the right thing at the right moment while the user is in someone else's window
const sayOnce = new Set();
async function coach(my, key, text) {
  if (sayOnce.has(key) || my !== gen) return;
  sayOnce.add(key);
  try { await say(text, "bot", my); } catch (e) { if (e !== STALE) throw e; }
}
function waiting(text, again) {
  $actions.innerHTML = `<div class="wait"><span class="spin"></span><span>${text}</span></div>${again ? '<div class="row"><button class="btn secondary" id="again" type="button">Abrir de nuevo</button></div>' : ""}<div class="err" id="err"></div>`;
  if (again) document.getElementById("again").onclick = again;
}
function connectGoogle(my) {
  const url = `/oauth/google/start?t=${TOKEN}`;
  let w = null;
  if (!isMobile) {
    try { store.set("popup", String(Date.now())); const wide = window.innerWidth >= 1000, pw = 480, left = Math.max(0, (window.screenX || 0) + window.outerWidth - pw - 12), top = Math.max(0, (window.screenY || 0) + 40);
    w = window.open(url, "sparrow-google", `width=${pw},height=700,left=${left},top=${top}`);
    if (w && wide) document.body.classList.add("split"); } catch (e) {}  // split: chat moves left, Google's window sits on the right, not on top of Lucía
  }
  if (!w) { store.set("popup", "0"); location.href = url; return; }  // phone or blocked: same tab, nothing else to coordinate
  setOrb("google"); waiting("Esperando a Google… mírala en la ventana de al lado", () => connectGoogle(my));
  const timers = [

  if (!fbReady) { err("Cargando Meta… pulsa de nuevo en un segundo."); loadFB(); return; }
  el.disabled = true; setOrb("meta", 10); startMetaCoaching();
  const a = state.answers;
  const digits = (a.personal_whatsapp || "").replace(/\D/g, "");
  FB.login((response) => {
    el.disabled = false; metaTimers.forEach(clearTimeout); setOrb("idle");
    if (response.authResponse && response.authResponse.code) {
      const code = response.authResponse.code;  // expires in ~30s: send it right away
      // Coexistence only returns waba_id (the server looks up the phone number)
      const wait = (n) => signup.waba_id ? finishSignup(code) : (n > 0 ? setTimeout(() => wait(n-1), 300) : finishSignup(code));
      wait(20);
    } else {
      add("La ventana se cerró antes de terminar. Puedes volver a intentarlo cuando quieras.", "bot"); scroll();
    }
  }, {
    config_id: META.configId,
    response_type: "code",
    override_default_response_type: true,
    extras: {
      setup: { business: { name: a.agent_name + (a.agency ? " · " + a.agency : ""), email: a.email || undefined,
               phone: digits ? { code: 34, number: digits.replace(/^34/, "") } : undefined } },
      featureType: "whatsapp_business_app_onboarding",
      sessionInfoVersion: "3",
    },
  });
}

render();
</script>
{% endblock %}
