{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block head %}
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --shadow:0 1px 2px rgba(28,36,51,.06), 0 8px 24px rgba(28,36,51,.07); --glass:rgba(255,253,248,.93); --ease:cubic-bezier(.22,.8,.24,1); --dock:120px; }
  html { -webkit-text-size-adjust:100%; }
  body { font-family:"Hanken Grotesk", -apple-system, "Segoe UI", sans-serif; }
  input, button { font-family:inherit; }
  body { background:radial-gradient(1200px 600px at 50% -10%, rgba(180,85,58,.10), transparent 60%), var(--bg); -webkit-font-smoothing:antialiased; }
  body.split { padding-right:var(--side,500px); } body.split .dock, body.split .top { right:var(--side,500px); }
  .chat { max-width:560px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .top { position:fixed; top:0; left:0; right:0; z-index:5; background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(18px); backdrop-filter:saturate(180%) blur(18px); padding-top:env(safe-area-inset-top); }
  .top-in { max-width:560px; margin:0 auto; padding:10px 16px; display:flex; gap:10px; align-items:center; }
  .avatar, .orb { border-radius:50%; flex:none; background:conic-gradient(from 0deg,#B4553A,#E9A07C,#F6F2EA,#1C2433,#B4553A); animation:spin 9s linear infinite; position:relative; }
  .avatar { width:28px; height:28px; font-size:0; } .avatar::after, .orb::after { content:""; position:absolute; inset:22%; border-radius:50%; background:var(--bg); filter:blur(1px); opacity:.88; }
  .orb { width:56px; height:56px; filter:blur(.3px); box-shadow:0 0 50px rgba(180,85,58,.25); }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes breathe { 50% { transform:scale(1.12); } }
  [data-orb=google] .orb, [data-orb=google] .avatar { background:conic-gradient(#EA4335,#FBBC05,#34A853,#4285F4,#EA4335); animation-duration:2.2s; }
  [data-orb=ok] .orb, [data-orb=ok] .avatar, [data-orb=done] .orb, [data-orb=done] .avatar { background:conic-gradient(#1FAF6B,#7EE2B0,#1FAF6B); animation:breathe 2.4s ease-in-out infinite; }
  [data-orb=meta] .orb, [data-orb=meta] .avatar { background:conic-gradient(#25D366 calc(var(--p,10) * 1%), rgba(150,150,150,.35) 0); animation:none; transition:background .6s; }
  .hero { margin:6px 0 18px; } .hero h1 { font-size:34px; line-height:1.15; margin:18px 0 0; font-weight:600; letter-spacing:-.02em; font-family:"Instrument Serif", Georgia, serif; font-weight:400; font-size:44px; letter-spacing:-.01em; color:var(--ink); }
  .hl { font-weight:600; background:linear-gradient(transparent 52%, rgba(180,85,58,.32) 52%); border-radius:2px; padding:0 1px; }
  .w { opacity:0; animation:wd .55s var(--ease) forwards; } @keyframes wd { from { opacity:0; filter:blur(4px); transform:translateY(4px); } to { opacity:1; filter:none; transform:none; } }
  .who { flex:1; line-height:1.2; min-width:0; } .who b { display:block; font-size:15px; } .who span { font-family:"IBM Plex Mono", monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .tools { max-width:560px; margin:0 auto; padding:0 16px 8px; display:flex; gap:8px; }
  .langs { margin-left:auto; display:flex; gap:2px; } .langs button { border:0 !important; background:none !important; padding:4px 7px !important; color:var(--muted) !important; font-family:"IBM Plex Mono", monospace !important; font-size:11.5px !important; letter-spacing:.06em; }
  .langs button.on { color:var(--ink) !important; font-weight:600; text-decoration:underline; }
  .tools button { background:var(--card); border:1px solid var(--line); border-radius:99px; padding:4px 12px; font:inherit; font-size:12.5px; color:var(--ink); cursor:pointer; }
  .tools button:hover { border-color:var(--accent); }
  .row-edit { display:flex; align-items:center; gap:10px; margin:8px 0; } .row-edit .k { min-width:92px; } .row-edit .v { flex:1; min-width:0; word-break:break-word; } .row-edit button { padding:4px 10px; font-size:13px; }
  .helpbtn { background:none; border:0; color:var(--accent); font:inherit; font-size:13px; cursor:pointer; padding:6px 4px; white-space:nowrap; }
  .bar { height:2px; background:transparent; } .bar i { display:block; height:2px; width:0; background:var(--accent); transition:width .8s var(--ease); }
  .msgs { flex:1; gap:14px; padding:calc(112px + env(safe-area-inset-top)) 16px calc(var(--dock) + 24px); display:flex; flex-direction:column; gap:10px; }
  .msgs > .new, .msgs > .opts { animation:rise .45s var(--ease) both; } .msgs.quiet > * { animation:none !important; }
  @keyframes rise { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:none; } }
  .b { max-width:100%; white-space:pre-line; line-height:1.5; }
  .bot { font-size:19px; color:var(--ink); line-height:1.5; letter-spacing:-.005em; align-self:flex-start; margin:4px 0; }
  .me { background:var(--line); color:var(--ink); align-self:flex-end; max-width:82%; padding:9px 16px; border-radius:22px; font-size:16px; }
  .dock { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; justify-content:center; padding:0 12px calc(12px + env(safe-area-inset-bottom)); pointer-events:none; }
  .actions { pointer-events:auto; width:100%; max-width:536px; background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(22px); backdrop-filter:saturate(180%) blur(22px); border:1px solid var(--line); border-radius:30px; padding:10px; box-shadow:0 10px 40px rgba(28,36,51,.14); }
  .comp { display:flex; align-items:flex-end; gap:4px; }
  .comp textarea { flex:1; min-width:0; resize:none; border:0; background:transparent; outline:none; font:inherit; font-size:17px; line-height:1.4; padding:11px 8px; max-height:150px; color:var(--ink); border-radius:0; }
  .send { flex:none; width:42px; height:42px; border-radius:50%; border:0; background:var(--ink); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-bottom:1px; }
  .send:active { transform:scale(.94); }
  .opts { display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 6px; }
  .opts .btn { border-radius:99px; padding:11px 18px; font-size:15px; transition:transform .15s var(--ease); background:var(--ink); color:#fff; }
  .opts .btn.secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .opts .btn.g { background:#fff; color:#3c4043; border:1px solid #dadce0; }
  .opts.solo .btn { flex:1 1 100%; padding:19px 24px; font-size:17px; }
  .opts .btn:active { transform:scale(.97); }
  .b.think { color:var(--muted); animation:blink 1.1s infinite; }
  .btn.g { background:#fff; color:#3c4043; border:1px solid #dadce0; font-weight:500; }
  .wait { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:14px; padding:2px 4px 8px; }
  .spin { width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:sp 0.8s linear infinite; flex:none; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .coach { background:var(--card); box-shadow:var(--shadow); border-radius:22px; padding:13px 18px; font-size:15px; align-self:stretch; }
  .coach ol { margin:6px 0 0; padding-left:20px; } .coach li { margin:4px 0; }
  .warn { border-left:3px solid var(--accent); }
  .err { color:var(--bad); font-size:14px; margin-top:6px; } .err:empty { display:none; }
  .progress { font-size:12px; color:var(--muted); font-weight:400; }
  .typing { display:inline-flex; gap:4px; padding:8px 0; }
  .typing i { width:7px; height:7px; border-radius:50%; background:var(--muted); opacity:.35; animation:blink 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay:.18s; } .typing i:nth-child(3) { animation-delay:.36s; }
  @keyframes blink { 0%,80%,100% { opacity:.25; transform:translateY(0) } 40% { opacity:1; transform:translateY(-3px) } }
  .wa2 { align-self:stretch; border-radius:18px; overflow:hidden; box-shadow:var(--shadow); color:#111; }
  .wa-head { background:#075E54; color:#fff; display:flex; align-items:center; gap:10px; padding:9px 12px; } .wa-head b { display:block; font-size:15px; font-weight:600; line-height:1.2; } .wa-head small { opacity:.8; font-size:12px; }
  .wa-av { width:34px; height:34px; border-radius:50%; background:#25D366; display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; }
  .wa-body { background:#ECE5DD; padding:12px 10px 14px; display:flex; flex-direction:column; gap:6px; min-height:120px; background-image:radial-gradient(rgba(0,0,0,.04) 1px, transparent 1px); background-size:14px 14px; }
  .wab { max-width:86%; padding:7px 9px 5px; border-radius:9px; font-size:15px; line-height:1.4; white-space:pre-line; box-shadow:0 1px 1px rgba(0,0,0,.12); }
  .wab.in { background:#fff; align-self:flex-start; border-top-left-radius:2px; } .wab.out { background:#D9FDD3; align-self:flex-end; border-top-right-radius:2px; animation:rise .4s var(--ease) both; }
  .wab .t { display:block; text-align:right; font-size:11px; color:#667781; margin-top:2px; } .tick { color:#53BDEB; }
  .wa { align-self:stretch; background:#ECE5DD; border-radius:18px; padding:12px; box-shadow:var(--shadow); color:#111; }
  .wa small { display:block; color:#667781; font-size:12px; margin-bottom:6px; }
  .wa div { background:#DCF8C6; border-radius:12px; padding:9px 11px; white-space:pre-line; font-size:15px; box-shadow:0 1px 1px rgba(0,0,0,.08); }
  .suggest { display:flex; flex-wrap:wrap; gap:6px; margin:2px 4px 8px; }
  .actions .suggest .btn { padding:6px 12px; font-size:13px; font-weight:500; flex:0 0 auto; }
  .mic { flex:none; width:44px; height:44px; border-radius:50%; border:0; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .2s, color .2s; }
  .mic:hover { color:var(--ink); } .mic.on { background:var(--accent); color:#fff; animation:breathe 1.2s ease-in-out infinite; }
  .att { flex:none; width:40px; height:44px; border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:20px; }
  .skip { background:none; border:0; color:var(--muted); font:inherit; font-size:14px; padding:6px 10px; cursor:pointer; }
  .suggest button { padding:6px 12px; font-size:13px; border-radius:99px; flex:none !important; }
  .chip { display:flex; align-items:center; gap:8px; margin:6px 0; } .chip code { flex:1; }
  .chip button { padding:5px 10px; font-size:13px; }
  .opts .btn.long { border-radius:18px; text-align:left; line-height:1.3; }
  .pedit { display:flex; flex-direction:column; gap:10px; }
  .pedit textarea.ed { min-height:120px; font-size:16px; line-height:1.45; resize:vertical; }
  .fchips { display:flex; flex-wrap:wrap; gap:6px; } .fchips .btn { padding:5px 10px; font-size:13px; border-radius:99px; font-family:"IBM Plex Mono", monospace; font-weight:500; }
  .plist { margin:0; padding-left:18px; font-size:14px; } .plist:empty { display:none; } .plist.probs { color:var(--bad); } .plist.warns { color:var(--muted); } .plist li { margin:3px 0; }
  .risks { margin:0; padding-left:20px; } .risks li { margin:7px 0; }
  .btnrow { display:flex; flex-wrap:wrap; gap:8px; }
  .pedit .wa2 { align-self:stretch; } .pedit .wab { max-width:100%; word-break:break-word; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
{% endblock %}
{% block body %}
<div class="chat">
  <div class="top">
    <div class="top-in">
      <div class="avatar" id="avatar"></div>
      <div class="who"><b><span id="aname"></span> <span class="progress" id="progress"></span></b><span id="subtitle"></span></div>
      <button class="helpbtn" id="helpbtn" type="button"></button>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="tools"><button type="button" id="mydata"></button><button type="button" id="askbtn"></button><span class="langs" id="langs"></span></div>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="dock"><div class="actions" id="actions">
    <div id="status"></div>
    <form class="comp" id="comp"><button class="att" id="att" type="button" aria-label="Subir captura">📎</button><textarea id="ci" rows="1" placeholder="" autocomplete="off"></textarea><button class="send" id="send" type="submit" aria-label="Enviar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button><input id="cf" type="file" accept="image/*" hidden></form>
    <div class="err" id="err"></div>
  </div></div>
</div>

<script>
const TOKEN = {{ token|tojson }};
const FAKE = {{ 'true' if fake else 'false' }};
const META = { appId: {{ meta_app_id|tojson }}, configId: {{ meta_config_id|tojson }}, version: {{ graph_version|tojson }} };
let state = {{ state_json|safe }};
const params = new URLSearchParams(location.search);
const LANG = {{ lang|tojson }}, I18N = {{ i18n|tojson }};
// every agent-facing text goes through tr(): the Spanish text is the key; es shows it as is, en/fr come from app/i18n_onb.py
const tr = (s, v) => { let r = I18N[s] || s; if (v) for (const k in v) r = r.split("{" + k + "}").join(v[k]); return r; };
const fmtSlot = (id) => { try { return new Intl.DateTimeFormat(LANG, { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", hour12: LANG === "en" }).format(new Date(id)); } catch (e) { return id; } };
// Google opens in a side window; when it lands back here, that window reports the result and closes itself
try {
  const g = params.get("google"), flag = +(localStorage.getItem(`sp:${TOKEN}:popup`) || 0);
  if (g && flag && Date.now() - flag < 600000) {
    localStorage.setItem(`sp:${TOKEN}:popup`, "0"); localStorage.setItem(`sp:${TOKEN}:gres`, g + ":" + Date.now());
    window.close();
    document.body.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin-top:30vh"></p>'; document.body.firstChild.textContent = tr("Listo. Ya puedes cerrar esta ventana y volver a Sparrow.");
    throw new Error("popup-done");
  }
} catch (e) { if (e.message === "popup-done") throw e; }
const STALE = Symbol("stale");
const isMobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const setOrb = (v, p) => { document.documentElement.dataset.orb = v; if (p !== undefined) document.documentElement.style.setProperty("--p", p); };
const $msgs = document.getElementById("msgs"), $actions = document.getElementById("actions");

// ---- tiny storage helpers (storage can be blocked: the chat must still work)
const store = {
  get(k) { try { return localStorage.getItem(`sp:${TOKEN}:${k}`); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(`sp:${TOKEN}:${k}`, v); } catch (e) {} },
};
const seen = new Set(JSON.parse(store.get("seen") || "[]"));

// ---- chat mechanics: ONE continuous conversation. Messages already shown replay instantly; new ones fade in word by word.
let gen = 0, pollTimer = null;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const $status = document.getElementById("status"), $ci = document.getElementById("ci"), $comp = document.getElementById("comp"), $cf = document.getElementById("cf"), $att = document.getElementById("att");
function add(text, who, fresh = true) {
  const d = document.createElement("div"); d.className = "b " + who + (fresh ? " new" : "");
  if (who === "bot") {  // **text** is highlighted; new messages fade in word by word
    const parts = text.split(/(\*\*[^*]+\*\*)/).filter(Boolean), total = text.split(/\s+/).length, step = Math.min(38, 900 / Math.max(total, 1)); let k = 0;
    for (const seg of parts) {
      const hl = seg.startsWith("**"), body = hl ? seg.slice(2, -2) : seg;
      if (!fresh) { if (hl) { const g = document.createElement("span"); g.className = "hl"; g.textContent = body; d.append(g); } else d.append(body); continue; }
      for (const t of body.split(/(\s+)/)) {
        if (!t) continue;
        if (/^\s+$/.test(t)) { if (hl) { const g = document.createElement("span"); g.className = "hl"; g.textContent = t; d.append(g); } else d.append(t); continue; }
        const w = document.createElement("span"); w.className = "w" + (hl ? " hl" : ""); w.style.animationDelay = (k++ * step) + "ms"; w.textContent = t; d.append(w);
      }
    }
  } else d.textContent = text;
  $msgs.appendChild(d); return d;
}
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function scroll() { requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: calm || $msgs.classList.contains("quiet") ? "auto" : "smooth" })); }
// the floating dock changes height: keep the last message always visible above it
new ResizeObserver(() => { document.documentElement.style.setProperty("--dock", ($actions.offsetHeight || 0) + 12 + "px"); scroll(); }).observe($actions);
async function say(text, who, my) {
  const key = who === "bot" ? text : "me:" + text, fresh = !seen.has(key);
  if (fresh) { seen.add(key); store.set("seen", JSON.stringify([...seen])); $msgs.classList.remove("quiet"); }
  if (my !== gen) throw STALE;
  add(text, who, fresh); scroll();
  if (fresh && who === "bot") await sleep(Math.min(1000, 250 + text.split(/\s+/).length * 28));  // let the words land before the next line
}
async function api(path, body) {
  const r = await fetch(`/api/o/${TOKEN}${path}`, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({ ok: false, error: tr("Error de conexión") }));
  if (data.step) state = data;
  return data;
}
function err(t) { document.getElementById("err").textContent = t || ""; }

// ---- the composer (always there): answers the question in view, or chats with Lucía about anything
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const CAN_TALK = !!SR && !/iPhone|iPad|iPod/i.test(navigator.userAgent) && !/Firefox/i.test(navigator.userAgent);  // patchy there: hide the button
const DEFAULT_PH = tr("Escribe o toca una opción…");
let expect = null, chatOnce = false, shot = null, busy = false;
const helpHistory = [];
function resize() { $ci.style.height = "auto"; $ci.style.height = Math.min($ci.scrollHeight, 150) + "px"; }
function setExpect(o) { expect = o; chatOnce = false; $ci.value = o.value || $ci.value;  // keep what they already typed while the question was still appearing
   $ci.placeholder = o.ph || DEFAULT_PH; $ci.setAttribute("inputmode", o.type === "tel" ? "tel" : "text"); resize(); $ci.focus(); }
function clearExpect() { expect = null; chatOnce = false; $ci.value = ""; $ci.placeholder = DEFAULT_PH; $ci.setAttribute("inputmode", "text"); resize(); }
$ci.addEventListener("input", resize);
$ci.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !isMobile) { e.preventDefault(); $comp.requestSubmit(); } });
function talk(input, btn) {  // the browser's own speech recognition: free; the words show (and wrap) as they are heard, so they can be fixed before sending
  let rec = null, base = "", ph = "";
  btn.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = { es: "es-ES", en: "en-GB", fr: "fr-FR" }[LANG]; rec.interimResults = true; rec.continuous = true;
    base = input.value ? input.value.trim() + " " : ""; ph = input.placeholder;
    btn.classList.add("on"); input.placeholder = tr("Te escucho…");
    rec.onresult = (e) => { let t = ""; for (const r of e.results) t += r[0].transcript; input.value = base + t; resize(); };
    const stop = () => { btn.classList.remove("on"); input.placeholder = ph; rec = null; input.focus(); };
    rec.onend = stop; rec.onerror = (e) => { stop(); if (e.error === "not-allowed") err(tr("Activa el micrófono en el navegador para poder hablar.")); };
    rec.start();
  };
}
if (CAN_TALK) {
  const m = document.createElement("button"); m.className = "mic"; m.id = "mic"; m.type = "button"; m.setAttribute("aria-label", tr("Hablar"));
  m.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
  $comp.insertBefore(m, document.getElementById("send")); talk($ci, m);
}
async function shrink(file) {  // screenshots are resized in the browser: small, fast, and never stored
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.8);
}
$att.onclick = () => $cf.click();
$cf.onchange = async () => { try { shot = await shrink($cf.files[0]); $att.textContent = "✅"; err(""); } catch (e) { shot = null; err(tr("No he podido leer esa imagen.")); } };
$comp.onsubmit = async (e) => {
  e.preventDefault();
  const text = $ci.value.trim();
  if (!text && !shot) return;
  if (busy) { err(tr("Un segundo, que termino de escribir…")); return; }  // never send an answer to the wrong place while a question is still appearing
  err("");
  if (expect && !chatOnce && !shot) return expect.onSubmit(text, false);  // answering the question in view
  return askLucia(text);  // anything else is a conversation with Lucía
};
async function askLucia(text) {
  const image = shot; shot = null; $cf.value = ""; $att.textContent = "📎";
  chatOnce = false; $ci.value = ""; resize(); if (expect) $ci.placeholder = expect.ph || DEFAULT_PH;
  add((image ? "📷 " : "") + (text || tr("Captura de pantalla")), "me"); scroll();
  helpHistory.push({ role: "user", text });
  const thinking = add("…", "bot", false); thinking.classList.add("think"); scroll();
  const r = await api("/help_chat", { text, image, history: helpHistory.slice(-6), lang: LANG });
  thinking.remove();
  if (r.ok) {

  await bot(tr("Opcional: si un propietario me dice que no, puedo mencionar tus resultados. Escríbelos tal como quieras que se digan, solo con datos reales (por ejemplo: «He vendido 12 pisos en esta zona este año»)."));
  if (d.pitch !== undefined) await me(d.pitch || tr("Sin resultados"));
  else {

      if (skip || !val) { pdraft.set({ pitch: "" }); return render(); }

      pdraft.set({ pitch: val }); render(); } });
    return false;

  const rc = document.createElement("div"); rc.className = "coach warn new"; const ul = document.createElement("ul"); ul.className = "risks";
  risks.forEach((t) => { const l = document.createElement("li"); l.textContent = t; ul.appendChild(l); }); rc.appendChild(ul); $msgs.appendChild(rc); scroll();
  const ACK = tr("Entiendo los riesgos y me hago responsable del texto y de los contactos");

  $msgs.appendChild(card); scroll();
  const activate = async (el) => {
    el.disabled = true; err("");
    const r = await api("/prospecting", { enabled: true, location_id: d.place.id, zone_name: d.place.name, property_types: PT[d.types], min_price: nz(d.min), max_price: nz(d.max), daily_cap: d.cap, cold_body: d.body, success_pitch: d.pitch || "", ack_risk: true });

    }
    store.set("pres", r.enabled ? "on" : r.reason === "not_live" ? "not_live" : "other"); store.set("prosp", "done"); store.set("prosp:edit", "0"); pdraft.clear();
    await api(""); render();

  const change = (patch, label) => ({ label, secondary: true, onClick: () => { pdraft.set(patch); render(); } });
  buttons([{ label: tr("Sí, actívalo"), onClick: activate },
    { label: tr("Cambiar algo"), secondary: true, onClick: () => {
        add(tr("¿Qué quieres cambiar?"), "bot");
        buttons([change({ place: undefined }, tr("Zona")), change({ types: undefined }, tr("Inmuebles")), change({ min: undefined, max: undefined }, tr("Precio")), change({ cap: undefined }, tr("Máximo al día")),
                 change({ body: undefined, ack: undefined }, tr("Mensaje")), change({ pitch: undefined }, tr("Tus resultados")),
                 ...(editing ? [{ label: tr("Dejarlo como estaba"), onClick: () => { store.set("prosp:edit", "0"); pdraft.clear(); render(); } }] : [])]);
      } }]);

}
function chooseLang() {  // the three languages, each in its own name
  buttons(["es", "fr", "en"].filter((c) => c !== LL()).map((c) => ({ label: NATIVE[c], onClick: async () => {
    const r = await api("/answers", { lead_lang: c }); if (r.ok === false) return err(tr(r.error));
    store.set("ask:lang", "1"); try { localStorage.removeItem(`sp:${TOKEN}:peek`); } catch (e) {}  // slot labels are in the owners' language
    render(); } })), true);
}
// ---- "Mis datos": change anything they told us, at any moment (scripted, no AI). Or just ask Lucía in the chat.
function myData() {
  document.querySelectorAll(".opts").forEach((e) => e.remove());
  add(tr("Esto es lo que tengo. Toca **Cambiar** en lo que quieras, o dímelo aquí abajo."), "bot");
  const card = document.createElement("div"); card.className = "coach new";
  for (const [f, label, q] of FIELDS) {
    const row = document.createElement("div"); row.className = "row-edit";
    row.innerHTML = `<span class="small muted k"></span><span class="v"></span><button class="btn secondary" type="button"></button>`; row.querySelector("button").textContent = tr("Cambiar");
    row.querySelector(".k").textContent = label;
    row.querySelector(".v").textContent = (f === "personal_whatsapp" ? pretty(state.answers[f]) : state.answers[f]) || "—";

    prow.querySelector(".k").textContent = tr("Prospección");
    prow.querySelector(".v").textContent = on && P.zone_name ? [P.zone_name, ptypeKey(P.property_types) === "both" ? tr("Pisos y casas") : ptypeLabel(ptypeKey(P.property_types)), tr("{n} al día", { n: P.daily_cap })].filter(Boolean).join(" · ") : tr("No activada");
    prow.querySelector("button").textContent = on ? tr("Cambiar") : tr("Activar"); prow.querySelector("button").onclick = () => startProspectingEdit();

function editField(f, label, q) {

  inputRow({ ph: label, type: f === "personal_whatsapp" ? "tel" : "text", value: state.answers[f] || "", zones: f === "zones", joiner: ", ", optional: true, skipLabel: tr("Cancelar"),
    onSubmit: async (val, skip) => {

}
document.getElementById("mydata").onclick = () => myData();
document.getElementById("askbtn").onclick = () => helpChat("general");
// ---- Meta Embedded Signup (WhatsApp Business app onboarding = Coexistence) ----
let signup = {}, metaTimers = [];
function metaCoach(data) {  // Meta tells us which screen the user is on: speak up at that moment
  const step = String((data.data && data.data.current_step) || data.event || "").toLowerCase(), n = firstName(state.answers.agent_name), my = gen;
  const hi = n ? `${n}, ` : "";
  const ring = /qr|scan|link|device/.test(step) ? 75 : /phone|number/.test(step) ? 50 : /pay|billing|card/.test(step) ? 90 : /business|portfolio|info/.test(step) ? 25 : null;
  if (ring) setOrb("meta", ring);
  if (/qr|scan|link|device/.test(step)) coach(my, "m-qr", tr("{hi}ahora coge tu móvil: abre **WhatsApp Business** → Ajustes → Dispositivos vinculados → Vincular un dispositivo, y **escanea el código QR** de la pantalla.", { hi }));
  else if (/phone|number/.test(step)) coach(my, "m-phone", tr("{hi}Meta te pide tu número: elige **«Ingresar un nuevo número de teléfono»** y escribe el de tu **WhatsApp Business**. Es lo normal, aunque ya lo uses.", { hi }));
  else if (/pay|billing|card/.test(step)) coach(my, "m-pay", tr("{hi}Meta pide una tarjeta: es para que WhatsApp te cobre sus céntimos por conversación. Nosotros no la vemos. **Sin ella no podré escribir a tus propietarios.**", { hi }));
  else if (/business|portfolio|info/.test(step)) coach(my, "m-biz", tr("{hi}revisa que tus datos estén bien y pulsa Siguiente. No hace falta CIF.", { hi }));
}
function startMetaCoaching() {  // short tips that cover most cases; Meta's own step signals take over when they arrive; the help chat is the safety net
  const my = gen, n = firstName(state.answers.agent_name), hi = n ? `${n}, ` : "";
  metaTimers.forEach(clearTimeout);
  metaTimers = [
    setTimeout(() => coach(my, "m1", tr("{hi}Meta te va a pedir iniciar sesión en Facebook. Si no tienes cuenta, puedes crearla ahí mismo.", { hi })), 4000),
    setTimeout(() => coach(my, "m2", tr("Cuando te pida el número, elige **«Ingresar un nuevo número de teléfono»** y escribe el de tu **WhatsApp Business**. Es lo normal, aunque ya lo uses.")), 20000),
    setTimeout(() => coach(my, "m3", tr("¿Algo no sale como esperabas? Pulsa «Me ha salido otra cosa» y te ayudo.")), 60000),
  ];
}
window.addEventListener("message", (event) => {
  if (!event.origin.endsWith("facebook.com")) return;
  try {
    const data = JSON.parse(event.data);
    if (data.type !== "WA_EMBEDDED_SIGNUP") return;
    if (data.event && data.event.startsWith("FINISH")) signup = { waba_id: data.data.waba_id, phone_number_id: data.data.phone_number_id };
    else { api("/meta_event", { event: data.event, current_step: data.data && data.data.current_step }); metaCoach(data); }
  } catch (e) {}
});
const FB_LOCALE = { es: "es_ES", en: "en_US", fr: "fr_FR" };
function loadFB() {
  if (fbPromise) return fbPromise;
  return fbPromise = new Promise((resolve) => {
    if (window.FB) return resolve();
    window.fbAsyncInit = () => { FB.init({ appId: META.appId, autoLogAppEvents: true, xfbml: false, version: META.version }); fbReady = true; resolve(); };
    const s = document.createElement("script"); s.src = "https://connect.facebook.net/" + FB_LOCALE[LANG] + "/sdk.js"; s.async = true; s.crossOrigin = "anonymous";
    document.body.appendChild(s);
  });
}
async function finishSignup(code) {
  add(tr("Conectando…"), "me"); scroll();
  const r = await api("/meta", { code, waba_id: signup.waba_id, phone_number_id: signup.phone_number_id });
  if (r.ok === false) { add((tr(r.error) || tr("Algo falló.")) + " " + tr("Puedes reintentarlo; si se repite, pulsa «Hablar con una persona» arriba y te escribimos."), "bot"); buttons([{ label: tr("Reintentar"), onClick: (el) => launchSignup(el) }, { label: tr("Me ha salido otra cosa"), secondary: true, onClick: () => helpChat("meta") }]); return scroll(); }
  render();
}
let fbPromise = null, fbReady = false;
function launchSignup(el) {
  const bizName = state.answers.agent_name + (state.answers.agency ? " · " + state.answers.agency : "");
  try { navigator.clipboard.writeText(bizName).then(() => coach(gen, "copied", tr("Ya tienes tu nombre copiado («{nombre}»). Si Meta te lo pide, pégalo con Ctrl+V (⌘V en Mac).", { nombre: bizName }))).catch(() => {}); } catch (e) {}  // inside the click: browsers allow it
  if (FAKE) { el.disabled = true; signup = { waba_id:"fake-waba", phone_number_id:"fake-phone-" + TOKEN.slice(0,6) }; return finishSignup("fake-code"); }
  if (!fbReady) { err(tr("Cargando Meta… pulsa de nuevo en un segundo.")); loadFB(); return; }
  el.disabled = true; setOrb("meta", 10); startMetaCoaching();
  const a = state.answers;
  const digits = (a.personal_whatsapp || "").replace(/\D/g, "");
  const realOpen = window.open;  // the SDK opens Meta's window itself; steer it to the right edge, like Google's
  if (window.innerWidth >= 1000) {
    window.open = function (u, n, f) {
      try {
        const o = {}; String(f || "").split(",").forEach((kv) => { const [k, v] = kv.split("="); if (k) o[k.trim()] = (v || "").trim(); });
        const w = Math.min(+o.width || 520, 560), spot = sideSpot(w);
        o.left = spot.left; o.top = spot.top; splitView(w);
        f = Object.entries(o).map(([k, v]) => k + "=" + v).join(",");
      } catch (e) {}
      return realOpen.call(window, u, n, f);
    };
  }
  FB.login((response) => {
    el.disabled = false; metaTimers.forEach(clearTimeout); setOrb("idle"); document.body.classList.remove("split");
    if (response.authResponse && response.authResponse.code) {
      const code = response.authResponse.code;  // expires in ~30s: send it right away
      // Coexistence only returns waba_id (the server looks up the phone number)
      const wait = (n) => signup.waba_id ? finishSignup(code) : (n > 0 ? setTimeout(() => wait(n-1), 300) : finishSignup(code));
      wait(20);
    } else {
      add(tr("La ventana se cerró antes de terminar. Puedes volver a intentarlo cuando quieras."), "bot"); scroll();
    }
  }, {
    config_id: META.configId,
    response_type: "code",
    override_default_response_type: true,
    extras: {
      setup: { business: { name: a.agent_name + (a.agency ? " · " + a.agency : ""), email: a.email || undefined, website: store.get("web") || undefined,
               phone: digits ? { code: +state.cc, number: digits.replace(new RegExp("^" + state.cc), "") } : undefined } },
      featureType: "whatsapp_business_app_onboarding",
      sessionInfoVersion: "3",
    },
  });
  window.open = realOpen;
}

for (const code of ["es", "en", "fr"]) {
  const b = document.createElement("button"); b.type = "button"; b.textContent = code.toUpperCase(); if (code === LANG) b.className = "on";
  b.onclick = () => { try { document.cookie = `lang=${code};path=/;max-age=31536000;samesite=lax`; } catch (e) {} const u = new URL(location.href); u.searchParams.set("lang", code); location.href = u.toString(); };
  document.getElementById("langs").appendChild(b);
}
