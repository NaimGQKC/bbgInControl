{% extends "base.html" %}
{% block title %}Configura tu asistente · Sparrow AI{% endblock %}
{% block head %}
<style>
  :root { --shadow:0 1px 2px rgba(28,36,51,.06), 0 8px 24px rgba(28,36,51,.07); --glass:rgba(255,253,248,.78); --ease:cubic-bezier(.22,.8,.24,1); --dock:120px; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0E1014; --card:#1A1D24; --ink:#F2EEE6; --muted:#9AA1B0; --line:#2A2F3A; --accent:#D2694B; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); --glass:rgba(26,29,36,.8); }
    input, select, textarea { background:#12151B; } code { background:#262B35; } .me { background:var(--accent) !important; color:#fff !important; }
  }
  html { -webkit-text-size-adjust:100%; }
  body { background:radial-gradient(1200px 600px at 50% -10%, rgba(180,85,58,.10), transparent 60%), var(--bg); -webkit-font-smoothing:antialiased; }
  .chat { max-width:560px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .top { position:fixed; top:0; left:0; right:0; z-index:5; background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(18px); backdrop-filter:saturate(180%) blur(18px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top); }
  .top-in { max-width:560px; margin:0 auto; padding:10px 16px; display:flex; gap:10px; align-items:center; }
  .avatar { width:34px; height:34px; border-radius:50%; background:linear-gradient(145deg,var(--accent),#d98a6f); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; box-shadow:0 2px 8px rgba(180,85,58,.35); }
  .who { flex:1; line-height:1.2; min-width:0; } .who b { display:block; font-size:15px; } .who span { font-size:12px; color:var(--muted); }
  .helpbtn { background:none; border:0; color:var(--accent); font:inherit; font-size:13px; cursor:pointer; padding:6px 4px; white-space:nowrap; }
  .bar { height:2px; background:transparent; } .bar i { display:block; height:2px; width:0; background:var(--accent); transition:width .8s var(--ease); }
  .msgs { flex:1; padding:calc(76px + env(safe-area-inset-top)) 16px calc(var(--dock) + 24px); display:flex; flex-direction:column; gap:10px; }
  .msgs > * { animation:rise .45s var(--ease) both; }
  @keyframes rise { from { opacity:0; transform:translateY(10px) scale(.98); } to { opacity:1; transform:none; } }
  .b { max-width:88%; padding:11px 15px; border-radius:20px; white-space:pre-line; line-height:1.45; transition:opacity .6s; }
  .bot { background:var(--card); box-shadow:var(--shadow); align-self:flex-start; border-bottom-left-radius:6px; }
  .me { background:var(--ink); color:var(--bg); align-self:flex-end; border-bottom-right-radius:6px; }
  .dock { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; justify-content:center; padding:0 12px calc(12px + env(safe-area-inset-bottom)); pointer-events:none; }
  .actions { pointer-events:auto; width:100%; max-width:536px; background:var(--glass); -webkit-backdrop-filter:saturate(180%) blur(22px); backdrop-filter:saturate(180%) blur(22px); border:1px solid var(--line); border-radius:24px; padding:12px; box-shadow:0 10px 40px rgba(28,36,51,.16); }
  .actions:empty { display:none; }
  .actions > * { animation:rise .4s var(--ease) both; }
  .actions .row { flex-wrap:nowrap; } .actions .row:has(.btn:nth-child(3)) { flex-wrap:wrap; }
  .actions .row input { flex:1; min-width:0; border-radius:14px; }
  .actions .btn { border-radius:14px; padding:12px 18px; flex:1 1 auto; text-align:center; transition:transform .15s var(--ease), opacity .2s; }
  .actions .btn:active { transform:scale(.97); } .actions .row input + .btn { flex:none; }
  .wait { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:14px; padding:2px 4px 8px; }
  .spin { width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:sp 0.8s linear infinite; flex:none; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .coach { background:var(--card); box-shadow:var(--shadow); border-radius:18px; padding:13px 16px; align-self:stretch; }
  .coach ol { margin:6px 0 0; padding-left:20px; } .coach li { margin:4px 0; }
  .warn { border-left:3px solid var(--accent); }
  .err { color:var(--bad); font-size:14px; margin-top:6px; } .err:empty { display:none; }
  .progress { font-size:12px; color:var(--muted); font-weight:400; }
  .typing { display:inline-flex; gap:4px; padding:14px 16px; }
  .typing i { width:7px; height:7px; border-radius:50%; background:var(--muted); opacity:.35; animation:blink 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay:.18s; } .typing i:nth-child(3) { animation-delay:.36s; }
  @keyframes blink { 0%,80%,100% { opacity:.25; transform:translateY(0) } 40% { opacity:1; transform:translateY(-3px) } }
  .wa { align-self:stretch; background:#ECE5DD; border-radius:18px; padding:12px; box-shadow:var(--shadow); color:#111; }
  .wa small { display:block; color:#667781; font-size:12px; margin-bottom:6px; }
  .wa div { background:#DCF8C6; border-radius:12px; padding:9px 11px; white-space:pre-line; font-size:15px; box-shadow:0 1px 1px rgba(0,0,0,.08); }
  .suggest { display:flex; gap:6px; margin-bottom:8px; overflow-x:auto; scrollbar-width:none; } .suggest::-webkit-scrollbar { display:none; }
  .suggest button { padding:6px 12px; font-size:13px; border-radius:99px; white-space:nowrap; flex:none !important; }
  .chip { display:flex; align-items:center; gap:8px; margin:6px 0; } .chip code { flex:1; }
  .chip button { padding:5px 10px; font-size:13px; }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
{% endblock %}
{% block body %}
<div class="chat">
  <div class="top">
    <div class="top-in">
      <div class="avatar" id="avatar"></div>
      <div class="who"><b><span id="aname"></span> <span class="progress" id="progress"></span></b><span>asistente virtual (IA) de Sparrow</span></div>
      <button class="helpbtn" id="helpbtn" type="button">Hablar con una persona</button>
    </div>
    <div class="bar"><i id="barfill"></i></div>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="dock"><div class="actions" id="actions"></div></div>
</div>

<script>
const TOKEN = {{ token|tojson }};
const FAKE = {{ 'true' if fake else 'false' }};
const META = { appId: {{ meta_app_id|tojson }}, configId: {{ meta_config_id|tojson }}, version: {{ graph_version|tojson }} };
let state = {{ state_json|safe }};
const params = new URLSearchParams(location.search);
// Google opens in a side window; when it lands back here, that window reports the result and closes itself
try {
  const g = params.get("google"), flag = +(localStorage.getItem(`sp:${TOKEN}:popup`) || 0);
  if (g && flag && Date.now() - flag < 600000) {
    localStorage.setItem(`sp:${TOKEN}:popup`, "0"); localStorage.setItem(`sp:${TOKEN}:gres`, g + ":" + Date.now());
    window.close();
    document.body.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin-top:30vh">Listo. Ya puedes cerrar esta ventana y volver a Sparrow.</p>';
    throw new Error("popup-done");
  }
} catch (e) { if (e.message === "popup-done") throw e; }
const STALE = Symbol("stale");
const isMobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const $msgs = document.getElementById("msgs"), $actions = document.getElementById("actions");

// ---- tiny storage helpers (storage can be blocked: the chat must still work)
const store = {
  get(k) { try { return localStorage.getItem(`sp:${TOKEN}:${k}`); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(`sp:${TOKEN}:${k}`, v); } catch (e) {} },
};
const seen = new Set(JSON.parse(store.get("seen") || "[]"));

// ---- chat mechanics: messages that were already shown appear at once; new ones "type" first, like a person
let gen = 0, pollTimer = null;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function add(text, who) { const d = document.createElement("div"); d.className = "b " + who; d.textContent = text; $msgs.appendChild(d); return d; }
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function scroll() { requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: calm ? "auto" : "smooth" })); }
// the floating dock changes height: keep the last message always visible above it
new ResizeObserver(() => { document.documentElement.style.setProperty("--dock", ($actions.offsetHeight || 0) + 12 + "px"); scroll(); }).observe($actions);
async function say(text, who, my) {
  if (who === "bot" && !seen.has(text)) {
    const dots = document.createElement("div"); dots.className = "b bot typing"; dots.innerHTML = "<i></i><i></i><i></i>";
    $msgs.appendChild(dots); scroll();
    await sleep(Math.min(1100, 350 + text.length * 9));
    dots.remove();
    if (my !== gen) throw STALE;
    seen.add(text); store.set("seen", JSON.stringify([...seen]));
  }
  if (my !== gen) throw STALE;
  add(text, who); scroll();
}
async function api(path, body) {
  const r = await fetch(`/api/o/${TOKEN}${path}`, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({ ok: false, error: "Error de conexión" }));
  if (data.step) state = data;
  return data;
}
function err(t) { const e = document.getElementById("err"); if (e) e.textContent = t || ""; }
function inputRow({ ph = "", type = "text", button = "Enviar", onSubmit, optional = false, skipLabel = "Saltar", suggestions = [] }) {
  $actions.innerHTML = `${suggestions.length ? '<div class="suggest" id="sg"></div>' : ""}<form class="row" id="f"><input id="i" type="${type}" placeholder="${ph}" autocomplete="on" ${optional ? "" : "required"}>
    <button class="btn" type="submit">${button}</button>${optional ? `<button class="btn secondary" type="button" id="skip">${skipLabel}</button>` : ""}</form><div class="err" id="err"></div>`;
  const i = document.getElementById("i"); i.focus();
  for (const text of suggestions) {  // tap an example to add it; the agent can edit the text freely
    const b = document.createElement("button"); b.type = "button"; b.className = "btn secondary"; b.textContent = text;
    b.onclick = () => { i.value = i.value ? `${i.value}. ${text}` : text; i.focus(); };
    document.getElementById("sg").appendChild(b);
  }
  scroll();
  document.getElementById("f").onsubmit = async (e) => { e.preventDefault(); await onSubmit(i.value.trim(), false); };
  if (optional) document.getElementById("skip").onclick = () => onSubmit("", true);
}
function buttons(list) {
  $actions.innerHTML = `<div class="row">${list.map((b, k) => `<button class="btn ${b.secondary ? "secondary" : ""}" data-k="${k}">${b.label}</button>`).join("")}</div><div class="err" id="err"></div>`;
  $actions.querySelectorAll("button").forEach((el) => (el.onclick = () => list[+el.dataset.k].onClick(el)));
  scroll();  // the bar just grew: keep the last message visible above it
}
function chips(items) {  // copy-paste helpers next to Meta's window
  const d = document.createElement("div"); d.className = "coach";
  d.innerHTML = "<b>Si Meta te pide algo, cópialo de aquí:</b>";
  for (const [label, value] of items.filter((x) => x[1])) {
    const row = document.createElement("div"); row.className = "chip";
    row.innerHTML = `<span class="small muted" style="min-width:64px">${label}</span><code></code><button class="btn secondary" type="button">Copiar</button>`;
    row.querySelector("code").textContent = value;
    row.querySelector("button").onclick = async (e) => { try { await navigator.clipboard.writeText(value); e.target.textContent = "¡Copiado!"; } catch (x) { e.target.textContent = "Cópialo a mano"; } };
    d.appendChild(row);
  }
  $msgs.appendChild(d);
}
const firstName = (n) => (n || "").trim().split(/\s+/)[0];
const pretty = (p) => (p || "").replace(/^\+34(\d{3})(\d{3})(\d{3})$/, "+34 $1 $2 $3");

// ---- header: who is talking, progress, help
document.getElementById("aname").textContent = state.assistant;
document.getElementById("avatar").textContent = state.assistant.charAt(0);
function updateProgress() {
  const groups = ["google", "questions", ...(state.payment.required ? ["payment"] : []), "whatsapp"];
  const at = { wa_check: "whatsapp", waiting_templates: "whatsapp", done: "whatsapp" }[state.step] || state.step;
  const n = Math.max(groups.indexOf(at), 0) + 1;
  document.getElementById("progress").textContent = state.step === "done" ? "listo" : `${n}/${groups.length}`;
  document.getElementById("barfill").style.width = (state.step === "done" ? 100 : Math.round(((n - 1 + 0.5) / groups.length) * 100)) + "%";
}
document.getElementById("helpbtn").onclick = () => {
  add("¿Prefieres que te llame una persona del equipo o que te escriba?", "bot"); scroll();
  buttons([
    { label: "📞 Que me llamen", onClick: () => helpForm("call") },
    { label: "💬 Que me escriban", onClick: () => helpForm("chat") },
    { label: "Seguir aquí", secondary: true, onClick: () => render() },
  ]);
};
function helpForm(kind) {
  const call = kind === "call";
  $actions.innerHTML = `<form id="hf" style="display:grid; gap:8px">
    <input id="hm" placeholder="${call ? "¿Cuándo te viene bien? (opcional)" : "¿Qué te pasa? (opcional)"}">
    ${state.answers.personal_whatsapp ? "" : '<input id="hp" type="tel" placeholder="Tu móvil" required>'}
    <div class="row"><button class="btn" type="submit">${call ? "Pedir llamada" : "Pedir que me escriban"}</button><button class="btn secondary" type="button" id="hx">Atrás</button></div><div class="err" id="err"></div></form>`;
  document.getElementById("hx").onclick = () => render();
  scroll();
  document.getElementById("hf").onsubmit = async (e) => {
    e.preventDefault();
    const r = await api("/help", { kind, message: document.getElementById("hm").value, phone: (document.getElementById("hp") || {}).value });
    if (r.ok === false) return err(r.error);
    await render();
    add(call ? `Hecho: una persona del equipo te llamará al ${pretty(r.contact)} lo antes posible.` : `Hecho: te escribimos al ${pretty(r.contact)} en unos minutos. Mientras, puedes seguir por aquí si quieres.`, "bot"); scroll();
  };
}


// ---- proactive coaching: say the right thing at the right moment while the user is in someone else's window
const sayOnce = new Set();
async function coach(my, key, text) {
  if (sayOnce.has(key) || my !== gen) return;
  sayOnce.add(key);
  try { await say(text, "bot", my); } catch (e) { if (e !== STALE) throw e; }
}
function waiting(text, again) {
  $actions.innerHTML = `<div class="wait"><span class="spin"></span><span>${text}</span></div>${again ? '<div class="row"><button class="btn secondary" id="again" type="button">Abrir de nuevo</button></div>' : ""}<div class="err" id="err"></div>`;
  if (again) document.getElementById("again").onclick = again;
}
function connectGoogle(my) {
  const url = `/oauth/google/start?t=${TOKEN}`;
  let w = null;
  if (!isMobile) {
    try { store.set("popup", String(Date.now())); w = window.open(url, "sparrow-google", "width=520,height=720,left=" + Math.max(0, screen.width / 2 - 260) + ",top=60"); } catch (e) {}
  }
  if (!w) { store.set("popup", "0"); location.href = url; return; }  // phone or blocked: same tab, nothing else to coordinate
  waiting("Esperando a Google…", () => connectGoogle(my));
  const timers = [
    setTimeout(() => coach(my, "g1", "Ya tienes Google abierto en otra ventana. Elige tu cuenta de Google Calendar."), 3500),
    setTimeout(() => coach(my, "g2", "Si sale «Google no ha verificado esta app»: pulsa Avanzado y luego «Ir a Sparrow AI». Tranquilo, es lo esperado."), 9000),
    setTimeout(() => coach(my, "g3", "En la lista de permisos, deja TODAS las casillas marcadas y pulsa Continuar. Si falta alguna, no podré agendar."), 17000),
  ];
  const done = setInterval(async () => {
    const res = (store.get("gres") || "").split(":")[0];
    if (res === "denied") { clearInterval(done); timers.forEach(clearTimeout); store.set("gres", ""); params.set("google", "denied"); try { w.close(); } catch (e) {} return render(); }
    await api("");
    if (state.integrations.google && state.integrations.google.status === "active") { clearInterval(done); timers.forEach(clearTimeout); store.set("gres", ""); try { w.close(); } catch (e) {} render(); }
    else if (w.closed && !(res)) { clearInterval(done); timers.forEach(clearTimeout); await coach(my, "gx", "Has cerrado la ventana de Google antes de terminar. Cuando quieras, lo intentamos otra vez."); buttons([{ label: "Abrir Google", onClick: () => connectGoogle(my) }]); }
  }, 1500);
}

// ---- the conversation: one section per step; finished sections replay instantly as history
const QUESTIONS = [
  { f: "agent_name", q: "¿Cómo te llamas? (nombre y apellido)", ph: "Laura García" },
  { f: "agency", q: "¿En qué inmobiliaria trabajas?", ph: "RE/MAX Confort" },
  { f: "zones", q: "¿En qué zonas o barrios captas? Sepáralos con comas.", ph: "Delicias, Actur, Centro" },
];
async function render() {
  const my = ++gen;
  clearInterval(pollTimer);
  $msgs.innerHTML = ""; $actions.innerHTML = "";
  try { await flow(my); } catch (e) { if (e !== STALE) throw e; }
}
async function flow(my) {
  const bot = (t) => say(t, "bot", my), me = (t) => say(t, "me", my);
  const a = state.answers, integ = state.integrations, step = state.step, pay = state.payment;
  const at = (s) => ["google", "questions", "payment", "wa_check", "whatsapp", "waiting_templates", "done"].indexOf(s);
  updateProgress();

  await bot(`¡Hola! Soy ${state.assistant}, tu asistente virtual de Sparrow 👋 Sí, soy una IA. Yo contacto a tus propietarios nuevos por WhatsApp y te dejo las valoraciones agendadas en tu calendario. Te lo dejo todo listo en unos 10 minutos. Y si prefieres hacerlo con una persona, pulsa «Hablar con una persona» arriba.`);

  // 1. Google: one click, and we learn who they are. Google's screens can't show our words, so we warn first and coach in time.
  await bot("Empezamos por tu Google Calendar, que es un clic. De ahí saco tus huecos libres y ahí aparecerán las citas.");
  if (!integ.google || integ.google.status !== "active") {
    if (params.get("google") === "denied") await bot("Parece que no se completó el permiso. Sin calendario no puedo agendar: vuelve a intentarlo cuando quieras.");
    await bot("Te aviso de lo que vas a ver para que no te asuste: Google enseñará un aviso que dice «Google no ha verificado esta app». Es normal, estamos terminando su revisión. Se salta en dos toques: Avanzado → Ir a Sparrow AI.");
    buttons([{ label: "Abrir Google", onClick: () => connectGoogle(my) }]);
    return;
  }
  await me("✅ Calendario conectado");
  let peek = JSON.parse(store.get("peek") || "null");  // proof that it works, and an early warning if a permission is missing
  if (!peek) { const r = await api("/calendar_check", {}); if (r.ok) { peek = r; store.set("peek", JSON.stringify(r)); } else peek = { failed: true }; }
  if (peek.failed) {
    await bot("Mmm, no consigo leer tu calendario. Suele pasar si en la ventana de Google se desmarca alguna casilla. Conéctalo otra vez y deja todas marcadas.");
    buttons([{ label: "Conectar de nuevo", onClick: () => connectGoogle(my) }]);
    return;
  }
  await bot(peek.first.length ? `Comprobado: veo tu agenda perfectamente. Por ejemplo, ahora mismo estás libre el ${peek.first.join(" o el ")}.` : "Comprobado: veo tu agenda perfectamente. Esta semana la tienes llena, ya ajustaremos los horarios.");

  // 2. Two questions (name comes from Google: just confirm it)
  const nameOk = () => store.get("nameOk") === "1";
  for (const q of QUESTIONS) {
    const v = a[q.f];
    const answered = v && (q.f !== "agent_name" || nameOk() || step !== "questions");
    if (answered) { await bot(q.q); await me(v); continue; }
    if (step !== "questions") continue;
    const ask = async () => {
      await bot(q.q);
      inputRow({ ph: q.ph, onSubmit: async (val) => {
        if (!val) return;
        const r = await api("/answers", { [q.f]: val });
        if (r.ok === false) return err(r.error);
        if (q.f === "agent_name") store.set("nameOk", "1");
        render();
      } });
    };
    if (q.f === "agent_name" && v) {
      await bot(`Por tu cuenta de Google veo que te llamas ${v}. ¿Te llamo ${firstName(v)}?`);
      buttons([{ label: `Sí, ${firstName(v)}`, onClick: () => { store.set("nameOk", "1"); render(); } },
               { label: "Prefiero otro nombre", secondary: true, onClick: () => { $actions.innerHTML = ""; ask(); } }]);
    } else await ask();
    return;
  }
  if (step === "questions") { await api("/answers", {}); return render(); }

  // 3. How do they want it to work? (optional, free text; it goes straight into the assistant's instructions)
  const PREFS_Q = "Una cosa más, opcional: ¿cómo quieres que trabaje por ti? Cuéntame lo que quieras (horarios, tono, tipo de inmuebles, lo que NO debo hacer) y lo tendré en cuenta en cada conversación.";
  if (a.extra_context) { await bot(PREFS_Q); await me(a.extra_context); }
  else if (store.get("prefs") === "skipped") { await bot(PREFS_Q); await me("Así está bien, de momento"); }
  else if (at(step) <= at("wa_check")) {
    await bot(PREFS_Q);
    inputRow({ ph: "Escríbelo con tus palabras", button: "Enviar", optional: true, skipLabel: "Así está bien",
      suggestions: ["Visitas solo por la tarde", "Trato de usted a los propietarios", "No agendes los viernes", "También valoro locales y terrenos"],
      onSubmit: async (val, skip) => {
        if (skip || !val) { store.set("prefs", "skipped"); return render(); }
        const r = await api("/answers", { extra_context: val });
        if (r.ok === false) return err(r.error);
        render();
      } });
    return;
  }

  // 3b. Show exactly what an owner will receive from their number
  if (state.first_message) {
    await bot("Así es el primer mensaje que recibirá un propietario nuevo, desde tu número:");
    const wa = document.createElement("div"); wa.className = "wa";
    const who = document.createElement("small"); who.textContent = "WhatsApp · Marta (propietaria, ejemplo)";
    const msg = document.createElement("div"); msg.textContent = state.first_message;
    wa.append(who, msg); $msgs.appendChild(wa); scroll();
  }

  // 4. Payment (only when a Stripe link is configured)
  if (pay.required) {
    await bot(`Ya casi. La puesta en marcha cuesta ${pay.fee} € una sola vez. Después, solo pagas ${pay.per_meeting} € por cada cita que te agende: si no hay citas, no pagas nada más.`);
    if (pay.paid) await me("✅ Pago recibido");
    else {
      buttons([
        { label: `Pagar ${pay.fee} €`, onClick: () => { window.open(pay.url, "_blank"); pollTimer = setInterval(async () => { await api(""); if (state.payment.paid) render(); }, 3000);
            err("Cuando termines de pagar, sigo yo sola."); } },
        { label: "Ya he pagado", secondary: true, onClick: async () => { await api(""); render(); } },
      ]);
      return;
    }
  }

  // 5. WhatsApp Business check
  await bot("Ahora lo importante: escribiré desde tu propio número de WhatsApp, así tus propietarios te reconocen. Tus chats y tu app siguen igual. Mis reglas:\n• Solo escribo a leads; nunca toco el resto de tus chats.\n• Si escribes tú a un cliente, me aparto.\n• Quien pida BAJA no vuelve a recibir nada.");
  await bot("¿Qué WhatsApp usas en el móvil? Hay dos: el normal y WhatsApp Business (icono verde con una B blanca).");
  if (at(step) > at("wa_check")) await me(store.get("waAnswer") || "Uso WhatsApp Business");
  else {
    const proceed = async (label) => { await me(label); store.set("waAnswer", label); await api("/step", { done: "wa_check" }); render(); };
    const downloadGuide = async () => {
      await bot("Sin problema, son 2 minutos:\n1. Descarga «WhatsApp Business» (es gratis).\n2. Ábrelo con tu mismo número: tus chats se pasan solos.\n3. Vuelve aquí.");
      buttons([{ label: "Ya lo tengo instalado", onClick: () => proceed("Ya tengo WhatsApp Business") }]);
    };
    buttons([
      { label: "Uso WhatsApp Business", onClick: () => proceed("Uso WhatsApp Business") },
      { label: "Uso el WhatsApp normal", secondary: true, onClick: async () => { await me("Uso el WhatsApp normal"); await downloadGuide(); } },
      { label: "No lo sé", secondary: true, onClick: async () => {
          await me("No lo sé");
          await bot("Fácil: mira el icono de WhatsApp en tu móvil. Si tiene una B blanca, es Business. Si no la tiene, es el normal.");
          buttons([
            { label: "Sí, tiene la B", onClick: () => proceed("Sí, tiene la B") },
            { label: "No, no tiene la B", secondary: true, onClick: async () => { await me("No, no tiene la B"); await downloadGuide(); } },
          ]);
      } },
    ]);
    return;
  }

  // 6. Meta signup (the popup is Meta's; we sit next to it with copy-paste helpers)
  await bot("Último paso: conectar tu WhatsApp. Se abrirá una ventana de Meta (Facebook) encima de esta página. Ten a mano tu móvil con WhatsApp Business y una tarjeta (WhatsApp cobra céntimos por conversación, directamente a ti).");
  if (at(step) > at("whatsapp")) await me("✅ WhatsApp conectado");
  else {
    if (isMobile) {
      await bot("Ojo: este paso es mucho más fácil desde un ordenador, porque tienes que escanear un código con el móvil.");
      const mail = `mailto:${encodeURIComponent(a.email || "")}?subject=${encodeURIComponent("Continuar la configuración de Sparrow")}&body=${encodeURIComponent(location.href)}`;
      $msgs.insertAdjacentHTML("beforeend", `<div class="coach small"><a href="${mail}">Envíame el enlace por email</a> para seguir desde el ordenador.</div>`);
    }
    await bot("Esto es lo que vas a ver:");
    $msgs.insertAdjacentHTML("beforeend", `<div class="coach"><ol>
      <li>Inicia sesión en Facebook y pulsa <b>Continuar</b>.</li>
      <li>Tus datos de empresa ya vienen rellenados: revisa y pulsa <b>Siguiente</b>.</li>
      <li>Elige <b>conectar tu app de WhatsApp Business</b> y escribe tu número.</li>
      <li>En tu móvil: WhatsApp Business → Ajustes → Dispositivos vinculados → <b>escanea el código QR</b>.</li>
      <li>Añade tu tarjeta y pulsa <b>Finalizar</b>.</li></ol></div>`);
    chips([["Nombre", a.agent_name + (a.agency ? " · " + a.agency : "")], ["Email", a.email]]);
    if (!FAKE) loadFB();  // load the SDK now so the popup opens straight from the click (no popup blocker)
    buttons([{ label: "Conectar WhatsApp", onClick: (el) => launchSignup(el) }]);
    scroll(); return;
  }

  // 7. Where to alert them (defaults to the number they just connected)
  if (store.get("alertOk") !== "1") {
    const saveAlert = async (val) => { const r = await api("/answers", { personal_whatsapp: val }); if (r.ok === false) return err(r.error); store.set("alertOk", "1"); render(); };
    if (a.personal_whatsapp) {
      await bot(`Un último detalle: si un cliente necesita que intervengas tú, te aviso por WhatsApp al ${pretty(a.personal_whatsapp)}. ¿Te va bien ese número?`);
      buttons([{ label: "Sí, perfecto", onClick: () => { store.set("alertOk", "1"); render(); } },
               { label: "Usar otro número", secondary: true, onClick: () => inputRow({ ph: "600 000 000", type: "tel", onSubmit: saveAlert }) }]);
    } else {
      await bot("Un último detalle: ¿a qué móvil te aviso si un cliente necesita que intervengas tú? Solo te escribiré para eso.");
      inputRow({ ph: "600 000 000", type: "tel", onSubmit: saveAlert });
    }
    return;
  }

  // 8. Waiting for Meta / done
  if (state.status !== "live") {
    await bot("Ahora toca esperar a que WhatsApp apruebe tus mensajes (suele tardar unas horas, a veces un día). No tienes que hacer nada: te escribo yo en cuanto esté activo. Si dejas esta página abierta, verás aquí mismo cuándo está listo.");
    pollTimer = setInterval(async () => { await api(""); if (state.status === "live") render(); }, 20000);
    return;
  }
  await bot("Listo 🎉 Tu asistente ya está activo. No tienes que volver aquí: cada lead nuevo recibirá un WhatsApp en 30 segundos y las citas aparecerán en tu Google Calendar con todo el contexto.");
  await bot("De conectar tu fuente de leads (Lystos) nos encargamos nosotros; te escribiremos si necesitamos algo.");
}
// ---- Meta Embedded Signup (WhatsApp Business app onboarding = Coexistence) ----
let signup = {}, metaTimers = [];
function metaCoach(data) {  // Meta tells us which screen the user is on: speak up at that moment
  const step = String((data.data && data.data.current_step) || data.event || "").toLowerCase(), n = firstName(state.answers.agent_name), my = gen;
  const hi = n ? `${n}, ` : "";
  if (/qr|scan|link|device/.test(step)) coach(my, "m-qr", `${hi}ahora coge tu móvil: WhatsApp Business → Ajustes → Dispositivos vinculados → Vincular un dispositivo, y escanea el código de la pantalla.`);
  else if (/phone|number/.test(step)) coach(my, "m-phone", `${hi}Meta te pide tu número: pon el de WhatsApp Business, con el que escribes a tus clientes.`);
  else if (/pay|billing|card/.test(step)) coach(my, "m-pay", `${hi}Meta pide una tarjeta: es para que WhatsApp te cobre sus céntimos por conversación. Nosotros no la vemos.`);
  else if (/business|portfolio|info/.test(step)) coach(my, "m-biz", `${hi}revisa que tus datos estén bien y pulsa Siguiente. No hace falta CIF.`);
}
function startMetaCoaching() {
  const my = gen, n = firstName(state.answers.agent_name), hi = n ? `${n}, ` : "";
  metaTimers.forEach(clearTimeout);
  metaTimers = [
    setTimeout(() => coach(my, "m1", `${hi}Meta te va a pedir iniciar sesión en Facebook. Si no tienes cuenta, puedes crearla ahí mismo.`), 4000),
    setTimeout(() => coach(my, "m2", "Cuando llegues a elegir cómo conectar, escoge tu app de WhatsApp Business."), 20000),
    setTimeout(() => coach(my, "m3", "¿Te has quedado atascado? Pulsa «Hablar con una persona» arriba y te ayudamos."), 90000),
  ];
}
window.addEventListener("message", (event) => {
  if (!event.origin.endsWith("facebook.com")) return;
  try {
    const data = JSON.parse(event.data);
    if (data.type !== "WA_EMBEDDED_SIGNUP") return;
    if (data.event && data.event.startsWith("FINISH")) signup = { waba_id: data.data.waba_id, phone_number_id: data.data.phone_number_id };
    else { api("/meta_event", { event: data.event, current_step: data.data && data.data.current_step }); metaCoach(data); }
  } catch (e) {}
});
function loadFB() {
  if (fbPromise) return fbPromise;
  return fbPromise = new Promise((resolve) => {
    if (window.FB) return resolve();
    window.fbAsyncInit = () => { FB.init({ appId: META.appId, autoLogAppEvents: true, xfbml: false, version: META.version }); fbReady = true; resolve(); };
    const s = document.createElement("script"); s.src = "https://connect.facebook.net/es_ES/sdk.js"; s.async = true; s.crossOrigin = "anonymous";
    document.body.appendChild(s);
  });
}
async function finishSignup(code) {
  add("Conectando…", "me"); scroll();
  const r = await api("/meta", { code, waba_id: signup.waba_id, phone_number_id: signup.phone_number_id });
  if (r.ok === false) { add((r.error || "Algo falló.") + " Puedes reintentarlo; si se repite, pulsa «Hablar con una persona» arriba y te escribimos.", "bot"); buttons([{ label:"Reintentar", onClick: (el) => launchSignup(el) }]); return scroll(); }
  render();
}
let fbPromise = null, fbReady = false;
function launchSignup(el) {
  if (FAKE) { el.disabled = true; signup = { waba_id:"fake-waba", phone_number_id:"fake-phone-" + TOKEN.slice(0,6) }; return finishSignup("fake-code"); }
  if (!fbReady) { err("Cargando Meta… pulsa de nuevo en un segundo."); loadFB(); return; }
  el.disabled = true; startMetaCoaching();
  const a = state.answers;
  const digits = (a.personal_whatsapp || "").replace(/\D/g, "");
  FB.login((response) => {
    el.disabled = false; metaTimers.forEach(clearTimeout);
    if (response.authResponse && response.authResponse.code) {
      const code = response.authResponse.code;  // expires in ~30s: send it right away
      // Coexistence only returns waba_id (the server looks up the phone number)
      const wait = (n) => signup.waba_id ? finishSignup(code) : (n > 0 ? setTimeout(() => wait(n-1), 300) : finishSignup(code));
      wait(20);
    } else {
      add("La ventana se cerró antes de terminar. Puedes volver a intentarlo cuando quieras.", "bot"); scroll();
    }
  }, {
    config_id: META.configId,
    response_type: "code",
    override_default_response_type: true,
    extras: {
      setup: { business: { name: a.agent_name + (a.agency ? " · " + a.agency : ""), email: a.email || undefined,
               phone: digits ? { code: 34, number: digits.replace(/^34/, "") } : undefined } },
      featureType: "whatsapp_business_app_onboarding",
      sessionInfoVersion: "3",
    },
  });
}

render();
</script>
