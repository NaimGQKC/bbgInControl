{% extends "base.html" %}
{% block title %}Configura tu asistente · Sparrow AI{% endblock %}
{% block head %}
<style>
  body { background:#EFE7DC; }
  .chat { max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); }
  .top { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; background:var(--card); position:sticky; top:0; z-index:2; }
  .avatar { width:38px; height:38px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; }
  .who { flex:1; line-height:1.25; } .who b { display:block; } .who span { font-size:12px; color:var(--muted); }
  .helpbtn { background:none; border:0; color:var(--accent); font:inherit; font-size:14px; cursor:pointer; text-decoration:underline; padding:4px; }
  .msgs { flex:1; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .b { max-width:86%; padding:10px 13px; border-radius:14px; white-space:pre-line; }
  .bot { background:var(--card); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px; }
  .me { background:#1C2433; color:#F6F2EA; align-self:flex-end; border-bottom-right-radius:4px; }
  .actions { padding:12px 16px 20px; border-top:1px solid var(--line); background:var(--card); position:sticky; bottom:0; }
  .actions .row input { flex:1; min-width:0; }
  .coach { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; align-self:stretch; }
  .coach ol { margin:6px 0 0; padding-left:20px; } .coach li { margin:4px 0; }
  .err { color:var(--bad); font-size:14px; margin-top:6px; }
  .progress { font-size:12px; color:var(--muted); }
  .typing { display:inline-flex; gap:4px; padding:13px 14px; }
  .typing i { width:7px; height:7px; border-radius:50%; background:var(--muted); opacity:.35; animation:blink 1.1s infinite; }
  .typing i:nth-child(2) { animation-delay:.18s; } .typing i:nth-child(3) { animation-delay:.36s; }
  @keyframes blink { 0%,80%,100% { opacity:.25 } 40% { opacity:1 } }
  .chip { display:flex; align-items:center; gap:8px; margin:6px 0; } .chip code { flex:1; }
  .chip button { padding:5px 10px; font-size:13px; }
</style>
{% endblock %}
{% block body %}
<div class="chat">
  <div class="top">
    <div class="avatar" id="avatar"></div>
    <div class="who"><b id="aname"></b><span>asistente virtual (IA) de Sparrow · <span class="progress" id="progress"></span></span></div>
    <button class="helpbtn" id="helpbtn" type="button">Necesito ayuda</button>
  </div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="actions" id="actions"></div>
</div>

<script>
const TOKEN = {{ token|tojson }};
const FAKE = {{ 'true' if fake else 'false' }};
const META = { appId: {{ meta_app_id|tojson }}, configId: {{ meta_config_id|tojson }}, version: {{ graph_version|tojson }} };
let state = {{ state_json|safe }};
const params = new URLSearchParams(location.search);
const STALE = Symbol("stale");
const isMobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const $msgs = document.getElementById("msgs"), $actions = document.getElementById("actions");

// ---- tiny storage helpers (storage can be blocked: the chat must still work)
const store = {
  get(k) { try { return localStorage.getItem(`sp:${TOKEN}:${k}`); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(`sp:${TOKEN}:${k}`, v); } catch (e) {} },
};
const seen = new Set(JSON.parse(store.get("seen") || "[]"));

// ---- chat mechanics: messages that were already shown appear at once; new ones "type" first, like a person
let gen = 0, pollTimer = null;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function add(text, who) { const d = document.createElement("div"); d.className = "b " + who; d.textContent = text; $msgs.appendChild(d); return d; }
function scroll() { window.scrollTo(0, document.body.scrollHeight); }
async function say(text, who, my) {
  if (who === "bot" && !seen.has(text)) {
    const dots = document.createElement("div"); dots.className = "b bot typing"; dots.innerHTML = "<i></i><i></i><i></i>";
    $msgs.appendChild(dots); scroll();
    await sleep(Math.min(1100, 350 + text.length * 9));
    dots.remove();
    if (my !== gen) throw STALE;
    seen.add(text); store.set("seen", JSON.stringify([...seen]));
  }
  if (my !== gen) throw STALE;
  add(text, who); scroll();
}
async function api(path, body) {
  const r = await fetch(`/api/o/${TOKEN}${path}`, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({ ok: false, error: "Error de conexión" }));
  if (data.step) state = data;
  return data;
}
function err(t) { const e = document.getElementById("err"); if (e) e.textContent = t || ""; }
function inputRow({ ph = "", type = "text", button = "Enviar", onSubmit, optional = false, value = "" }) {
  $actions.innerHTML = `<form class="row" id="f"><input id="i" type="${type}" placeholder="${ph}" value="${value}" autocomplete="on" ${optional ? "" : "required"}>
    <button class="btn" type="submit">${button}</button>${optional ? '<button class="btn secondary" type="button" id="skip">Saltar</button>' : ""}</form><div class="err" id="err"></div>`;
  const i = document.getElementById("i"); i.focus();
  document.getElementById("f").onsubmit = async (e) => { e.preventDefault(); await onSubmit(i.value.trim(), false); };
  if (optional) document.getElementById("skip").onclick = () => onSubmit("", true);
}
function buttons(list) {
  $actions.innerHTML = `<div class="row">${list.map((b, k) => `<button class="btn ${b.secondary ? "secondary" : ""}" data-k="${k}">${b.label}</button>`).join("")}</div><div class="err" id="err"></div>`;
  $actions.querySelectorAll("button").forEach((el) => (el.onclick = () => list[+el.dataset.k].onClick(el)));
}
function chips(items) {  // copy-paste helpers next to Meta's window
  const d = document.createElement("div"); d.className = "coach";
  d.innerHTML = "<b>Si Meta te pide algo, cópialo de aquí:</b>";
  for (const [label, value] of items.filter((x) => x[1])) {
    const row = document.createElement("div"); row.className = "chip";
    row.innerHTML = `<span class="small muted" style="min-width:64px">${label}</span><code></code><button class="btn secondary" type="button">Copiar</button>`;
    row.querySelector("code").textContent = value;
    row.querySelector("button").onclick = async (e) => { try { await navigator.clipboard.writeText(value); e.target.textContent = "¡Copiado!"; } catch (x) { e.target.textContent = "Cópialo a mano"; } };
    d.appendChild(row);
  }
  $msgs.appendChild(d);
}
const firstName = (n) => (n || "").trim().split(/\s+/)[0];
const pretty = (p) => (p || "").replace(/^\+34(\d{3})(\d{3})(\d{3})$/, "+34 $1 $2 $3");

// ---- header: who is talking, progress, help
document.getElementById("aname").textContent = state.assistant;
document.getElementById("avatar").textContent = state.assistant.charAt(0);
function updateProgress() {
  const groups = ["google", "questions", ...(state.payment.required ? ["payment"] : []), "whatsapp"];
  const at = { wa_check: "whatsapp", waiting_templates: "whatsapp", done: "whatsapp" }[state.step] || state.step;
  const n = Math.max(groups.indexOf(at), 0) + 1;
  document.getElementById("progress").textContent = state.step === "done" ? "listo" : `${n}/${groups.length}`;
}
document.getElementById("helpbtn").onclick = () => {
  $actions.innerHTML = `<form id="hf" style="display:grid; gap:8px"><div class="small">Cuéntame qué te pasa (opcional) y mi equipo te escribe enseguida.</div>
    <input id="hm" placeholder="Por ejemplo: no me sale el código QR">
    ${state.answers.personal_whatsapp ? "" : '<input id="hp" type="tel" placeholder="Tu móvil, para escribirte" required>'}
    <div class="row"><button class="btn" type="submit">Pedir ayuda</button><button class="btn secondary" type="button" id="hx">Cerrar</button></div><div class="err" id="err"></div></form>`;
  document.getElementById("hx").onclick = () => render();
  document.getElementById("hf").onsubmit = async (e) => {
    e.preventDefault();
    const r = await api("/help", { message: document.getElementById("hm").value, phone: (document.getElementById("hp") || {}).value });
    if (r.ok === false) return err(r.error);
    await render();
    add(`Ya he avisado a mi equipo: te escribirán al ${pretty(r.contact)} en unos minutos. Mientras, puedes seguir por aquí si quieres.`, "bot"); scroll();
  };
};

// ---- the conversation: one section per step; finished sections replay instantly as history
const QUESTIONS = [
  { f: "agent_name", q: "¿Cómo te llamas? (nombre y apellido)", ph: "Laura García" },
  { f: "agency", q: "¿En qué inmobiliaria trabajas?", ph: "RE/MAX Confort" },
  { f: "zones", q: "¿En qué zonas o barrios captas? Sepáralos con comas.", ph: "Delicias, Actur, Centro" },
];
async function render() {
  const my = ++gen;
  clearInterval(pollTimer);
  $msgs.innerHTML = ""; $actions.innerHTML = "";
  try { await flow(my); } catch (e) { if (e !== STALE) throw e; }
}
async function flow(my) {
  const bot = (t) => say(t, "bot", my), me = (t) => say(t, "me", my);
  const a = state.answers, integ = state.integrations, step = state.step, pay = state.payment;
  const at = (s) => ["google", "questions", "payment", "wa_check", "whatsapp", "waiting_templates", "done"].indexOf(s);
  updateProgress();

  await bot(`¡Hola! Soy ${state.assistant}, tu asistente virtual de Sparrow 👋 Sí, soy una IA. Yo contacto a tus propietarios nuevos por WhatsApp y te dejo las valoraciones agendadas en tu calendario. Te lo dejo todo listo en unos 10 minutos.`);

  // 1. Google: one click, and we learn who they are
  await bot("Empezamos por tu Google Calendar, que es un clic. De ahí saco tus huecos libres y ahí aparecerán las citas.");
  if (!integ.google || integ.google.status !== "active") {
    if (params.get("google") === "denied") await bot("Parece que no se completó el permiso. Sin calendario no puedo agendar: vuelve a intentarlo cuando quieras.");
    buttons([{ label: "Conectar Google Calendar", onClick: () => (location.href = `/oauth/google/start?t=${TOKEN}`) }]);
    return;
  }
  await me("✅ Calendario conectado");
  let peek = JSON.parse(store.get("peek") || "null");  // proof that it works, and an early warning if a permission is missing
  if (!peek) { const r = await api("/calendar_check", {}); if (r.ok) { peek = r; store.set("peek", JSON.stringify(r)); } else peek = { failed: true }; }
  if (peek.failed) {
    await bot("Mmm, no consigo leer tu calendario. Suele pasar si en la ventana de Google se desmarca alguna casilla. Conéctalo otra vez y deja todas marcadas.");
    buttons([{ label: "Conectar de nuevo", onClick: () => (location.href = `/oauth/google/start?t=${TOKEN}`) }]);
    return;
  }
  await bot(peek.first.length ? `Comprobado: veo tu agenda perfectamente. Por ejemplo, ahora mismo estás libre el ${peek.first.join(" o el ")}.` : "Comprobado: veo tu agenda perfectamente. Esta semana la tienes llena, ya ajustaremos los horarios.");

  // 2. Two questions (name comes from Google: just confirm it)
  const nameOk = () => store.get("nameOk") === "1";
  for (const q of QUESTIONS) {
    const v = a[q.f];
    const answered = v && (q.f !== "agent_name" || nameOk() || step !== "questions");
    if (answered) { await bot(q.q); await me(v); continue; }
    if (step !== "questions") continue;
    const ask = async () => {
      await bot(q.q);
      inputRow({ ph: q.ph, onSubmit: async (val) => {
        if (!val) return;
        const r = await api("/answers", { [q.f]: val });
        if (r.ok === false) return err(r.error);
        if (q.f === "agent_name") store.set("nameOk", "1");
        render();
      } });
    };
    if (q.f === "agent_name" && v) {
      await bot(`Por tu cuenta de Google veo que te llamas ${v}. ¿Te llamo ${firstName(v)}?`);
      buttons([{ label: `Sí, ${firstName(v)}`, onClick: () => { store.set("nameOk", "1"); render(); } },
               { label: "Prefiero otro nombre", secondary: true, onClick: () => { $actions.innerHTML = ""; ask(); } }]);
    } else await ask();
    return;
  }
  if (step === "questions") { await api("/answers", {}); return render(); }

  // 3. Payment (only when a Stripe link is configured)
  if (pay.required) {
    await bot(`Ya casi. La puesta en marcha cuesta ${pay.fee} € una sola vez. Después, solo pagas ${pay.per_meeting} € por cada cita que te agende: si no hay citas, no pagas nada más.`);
    if (pay.paid) await me("✅ Pago recibido");
    else {
      buttons([
        { label: `Pagar ${pay.fee} €`, onClick: () => { window.open(pay.url, "_blank"); pollTimer = setInterval(async () => { await api(""); if (state.payment.paid) render(); }, 3000);
            err("Cuando termines de pagar, sigo yo sola."); } },
        { label: "Ya he pagado", secondary: true, onClick: async () => { await api(""); render(); } },
      ]);
      return;
    }
  }

  // 4. WhatsApp Business check
  await bot("Ahora lo importante: escribiré desde tu propio número de WhatsApp, así tus propietarios te reconocen. Tus chats y tu app siguen igual. Mis reglas:\n• Solo escribo a leads; nunca toco el resto de tus chats.\n• Si escribes tú a un cliente, me aparto.\n• Quien pida BAJA no vuelve a recibir nada.");
  await bot("¿Usas WhatsApp Business? (el icono verde con una B)");
  if (at(step) > at("wa_check")) await me("Sí, uso WhatsApp Business");
  else {
    buttons([
      { label: "Sí, tiene la B", onClick: async () => { await api("/step", { done: "wa_check" }); render(); } },
      { label: "No / no lo sé", secondary: true, onClick: async () => {
          await me("No / no lo sé");
          await bot("Sin problema, son 2 minutos:\n1. Descarga \"WhatsApp Business\" en tu móvil.\n2. Ábrelo y elige tu mismo número. Tus chats se pasan solos.\n3. Vuelve aquí.");
          buttons([{ label: "Ya lo tengo", onClick: async () => { await api("/step", { done: "wa_check" }); render(); } }]);
      } },
    ]);
    return;
  }

  // 5. Meta signup (the popup is Meta's; we sit next to it with copy-paste helpers)
  await bot("Último paso: conectar tu WhatsApp. Se abrirá una ventana de Meta (Facebook) encima de esta página. Ten a mano tu móvil con WhatsApp Business y una tarjeta (WhatsApp cobra céntimos por conversación, directamente a ti).");
  if (at(step) > at("whatsapp")) await me("✅ WhatsApp conectado");
  else {
    if (isMobile) {
      await bot("Ojo: este paso es mucho más fácil desde un ordenador, porque tienes que escanear un código con el móvil.");
      const mail = `mailto:${encodeURIComponent(a.email || "")}?subject=${encodeURIComponent("Continuar la configuración de Sparrow")}&body=${encodeURIComponent(location.href)}`;
      $msgs.insertAdjacentHTML("beforeend", `<div class="coach small"><a href="${mail}">Envíame el enlace por email</a> para seguir desde el ordenador.</div>`);
    }
    await bot("Esto es lo que vas a ver:");
    $msgs.insertAdjacentHTML("beforeend", `<div class="coach"><ol>
      <li>Inicia sesión en Facebook y pulsa <b>Continuar</b>.</li>
      <li>Tus datos de empresa ya vienen rellenados: revisa y pulsa <b>Siguiente</b>.</li>
      <li>Elige <b>conectar tu app de WhatsApp Business</b> y escribe tu número.</li>
      <li>En tu móvil: WhatsApp Business → Ajustes → Dispositivos vinculados → <b>escanea el código QR</b>.</li>
      <li>Añade tu tarjeta y pulsa <b>Finalizar</b>.</li></ol></div>`);
    chips([["Nombre", a.agent_name + (a.agency ? " · " + a.agency : "")], ["Email", a.email]]);
    if (!FAKE) loadFB();  // load the SDK now so the popup opens straight from the click (no popup blocker)
    buttons([{ label: "Conectar WhatsApp", onClick: (el) => launchSignup(el) }]);
    scroll(); return;
  }

  // 6. Where to alert them (defaults to the number they just connected)
  if (store.get("alertOk") !== "1") {
    const saveAlert = async (val) => { const r = await api("/answers", { personal_whatsapp: val }); if (r.ok === false) return err(r.error); store.set("alertOk", "1"); render(); };
    if (a.personal_whatsapp) {
      await bot(`Un último detalle: si un cliente necesita que intervengas tú, te aviso por WhatsApp al ${pretty(a.personal_whatsapp)}. ¿Te va bien ese número?`);
      buttons([{ label: "Sí, perfecto", onClick: () => { store.set("alertOk", "1"); render(); } },
               { label: "Usar otro número", secondary: true, onClick: () => inputRow({ ph: "600 000 000", type: "tel", onSubmit: saveAlert }) }]);
    } else {
      await bot("Un último detalle: ¿a qué móvil te aviso si un cliente necesita que intervengas tú? Solo te escribiré para eso.");
      inputRow({ ph: "600 000 000", type: "tel", onSubmit: saveAlert });
    }
    return;
  }

  // 7. Waiting for Meta / done
  if (state.status !== "live") {
    await bot("Ahora toca esperar a que WhatsApp apruebe tus mensajes (suele tardar unas horas, a veces un día). No tienes que hacer nada: te escribo yo en cuanto esté activo. Si dejas esta página abierta, verás aquí mismo cuándo está listo.");
    pollTimer = setInterval(async () => { await api(""); if (state.status === "live") render(); }, 20000);
    return;
  }
  await bot("Listo 🎉 Tu asistente ya está activo. No tienes que volver aquí: cada lead nuevo recibirá un WhatsApp en 30 segundos y las citas aparecerán en tu Google Calendar con todo el contexto.");
  await bot("De conectar tu fuente de leads (Lystos) nos encargamos nosotros; te escribiremos si necesitamos algo.");
}
// ---- Meta Embedded Signup (WhatsApp Business app onboarding = Coexistence) ----
let signup = {};
window.addEventListener("message", (event) => {
  if (!event.origin.endsWith("facebook.com")) return;
  try {
    const data = JSON.parse(event.data);
    if (data.type !== "WA_EMBEDDED_SIGNUP") return;
    if (data.event && data.event.startsWith("FINISH")) signup = { waba_id: data.data.waba_id, phone_number_id: data.data.phone_number_id };
    else api("/meta_event", { event: data.event, current_step: data.data && data.data.current_step });
  } catch (e) {}
});
function loadFB() {
  if (fbPromise) return fbPromise;
  return fbPromise = new Promise((resolve) => {
    if (window.FB) return resolve();
    window.fbAsyncInit = () => { FB.init({ appId: META.appId, autoLogAppEvents: true, xfbml: false, version: META.version }); fbReady = true; resolve(); };
    const s = document.createElement("script"); s.src = "https://connect.facebook.net/es_ES/sdk.js"; s.async = true; s.crossOrigin = "anonymous";
    document.body.appendChild(s);
  });
}
async function finishSignup(code) {
  add("Conectando…", "me"); scroll();
  const r = await api("/meta", { code, waba_id: signup.waba_id, phone_number_id: signup.phone_number_id });
  if (r.ok === false) { add((r.error || "Algo falló.") + " Puedes reintentarlo; si se repite, pulsa «Necesito ayuda» arriba y te escribimos.", "bot"); buttons([{ label:"Reintentar", onClick: (el) => launchSignup(el) }]); return scroll(); }
  render();
}
let fbPromise = null, fbReady = false;
function launchSignup(el) {
  if (FAKE) { el.disabled = true; signup = { waba_id:"fake-waba", phone_number_id:"fake-phone-" + TOKEN.slice(0,6) }; return finishSignup("fake-code"); }
  if (!fbReady) { err("Cargando Meta… pulsa de nuevo en un segundo."); loadFB(); return; }
  el.disabled = true;
  const a = state.answers;
  const digits = (a.personal_whatsapp || "").replace(/\D/g, "");
  FB.login((response) => {
    el.disabled = false;
    if (response.authResponse && response.authResponse.code) {
      const code = response.authResponse.code;  // expires in ~30s: send it right away
      // Coexistence only returns waba_id (the server looks up the phone number)
      const wait = (n) => signup.waba_id ? finishSignup(code) : (n > 0 ? setTimeout(() => wait(n-1), 300) : finishSignup(code));
      wait(20);
    } else {
      add("La ventana se cerró antes de terminar. Puedes volver a intentarlo cuando quieras.", "bot"); scroll();
    }
  }, {
    config_id: META.configId,
    response_type: "code",
    override_default_response_type: true,
    extras: {
      setup: { business: { name: a.agent_name + (a.agency ? " · " + a.agency : ""), email: a.email || undefined,
               phone: digits ? { code: 34, number: digits.replace(/^34/, "") } : undefined } },
      featureType: "whatsapp_business_app_onboarding",
      sessionInfoVersion: "3",
    },
  });
}

render();
</script>
{% endblock %}
