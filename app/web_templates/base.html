<!doctype html>
<html lang="{{ lang|default('es') }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sparrow AI{% endblock %}</title>
<style>
  :root { --bg:#F6F2EA; --card:#FFFDF8; --ink:#1C2433; --muted:#5B6272; --line:#E4DCCD; --accent:#B4553A; --accent-ink:#fff; --ok:#2F7A4F; --bad:#B0302A; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color:var(--accent); }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin:0 0 16px; }
  h1 { font-size:28px; margin:0 0 12px; } h2 { font-size:20px; margin:0 0 12px; } h3 { font-size:16px; margin:0 0 8px; }
  .btn { display:inline-block; background:var(--accent); color:var(--accent-ink); border:0; border-radius:10px; padding:11px 16px; font-size:15px; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn.secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn:disabled { opacity:.5; cursor:default; }
  input, select, textarea { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); width:100%; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .muted { color:var(--muted); } .small { font-size:13px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; background:#EFE7DC; font-size:12px; }
  .pill.ok { background:#DDEFE3; color:var(--ok); } .pill.bad { background:#F5DEDC; color:var(--bad); }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .flash { background:#FFF4D6; border:1px solid #EBD9A1; padding:10px 12px; border-radius:10px; margin-bottom:16px; word-break:break-word; }
  code { background:#EFE7DC; padding:1px 5px; border-radius:6px; word-break:break-all; }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
